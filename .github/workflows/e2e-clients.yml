name: e2e-clients

# Run every REAL e2e suite (e2e/scripts/*.sh) against a locally started
# easyblobs, on GitHub CI — NOT on a developer machine.
#
# One job per DRIVER (the container that carries the client tool), so a single
# image is pulled once and all its protocols run in it. The driver/protocol
# mapping lives in e2e/ci-matrix.tsv so adding a protocol is a one-line change
# there, not in this file.
#
# The server runs INSIDE the job container, next to the client. That is simpler
# and avoids a real Actions limitation: the runner already starts the job
# container with its own --network github_network_..., so adding
# `options: --network host` makes `docker create` fail with exit 125 ("Value
# cannot be null. (Parameter 'ContainerId')") before any step runs.
# Because both processes share the container's network namespace, 127.0.0.1
# works and nothing extra is needed.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      only:
        description: "comma-separated protocols (empty = all)"
        required: false
        default: ""

permissions:
  contents: read

# NOTE on the shell: steps run with `sh` (the default) rather than forcing bash,
# because the minimal drivers (alpine, nix) have no bash until they install it.
# Instead the job's FIRST step installs bash, and every later step that needs
# bash-isms (`set -o pipefail`) asks for it explicitly with `shell: bash`.
# Background: node:22/maven/ubuntu:24.04 default to dash, where a bare
# `set -eu` aborts with "Illegal option -o pipefail" - that silently
# killed whole driver jobs before any test ran.

env:
  CGO_ENABLED: "0"
  EASYBLOBS_PORT: "8080"

jobs:
  # ---------------------------------------------------------------------------
  # Build the server ONCE and share the binary: every protocol job then only
  # starts it, which keeps the matrix cheap.
  # ---------------------------------------------------------------------------
  server:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.work
          cache: true
      - name: build easyblobs
        run: |
          set -eu
          go build -o easyblobs-bin ./cmd
          ls -lh easyblobs-bin
      - uses: actions/upload-artifact@v4
        with:
          name: easyblobs-bin
          path: easyblobs-bin
          retention-days: 1

  # ---------------------------------------------------------------------------
  # Resolve the matrix (driver -> protocols) from the TSV, so the protocol list
  # lives in ONE place.
  # ---------------------------------------------------------------------------
  matrix:
    runs-on: ubuntu-latest
    outputs:
      drivers: ${{ steps.gen.outputs.drivers }}
      count: ${{ steps.gen.outputs.count }}
    steps:
      - uses: actions/checkout@v4
      - id: gen
        name: build the driver matrix from e2e/ci-matrix.tsv
        env:
          ONLY: ${{ inputs.only }}
        run: |
          set -eu
          # One single line of JSON in the output variable: a real matrix body.
          out=$(python3 e2e/genmatrix.py)
          echo "drivers=$out" >> "$GITHUB_OUTPUT"
          # A compact human summary in the job log.
          echo "$out" | python3 -c 'import json,sys;d=json.load(sys.stdin);[print(x["driver"],"->",x["protocols"]) for x in d["include"]]'

  # ---------------------------------------------------------------------------
  # The real clients.
  # ---------------------------------------------------------------------------
  clients:
    needs: [server, matrix]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.matrix.outputs.drivers) }}
    # host networking so the container reaches the runner's 127.0.0.1:8080
    container:
      image: ${{ matrix.driver }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: easyblobs-bin
          path: /tmp/bin

      - name: toolchain sanity
        run: |
          set -eu
          echo "driver: ${{ matrix.driver }}"
          echo "protocols: ${{ matrix.protocols }}"
          # Do NOT require curl/wget/tar here: the minimal drivers (alpine,
          # nixos, ubuntu) install them in the next step. A hard check at this
          # point failed those jobs with "missing curl" before they could.
          echo "basics are ensured by the install step"

      # A few clients are NOT in their base image. Installing them here (rather
      # than baking a custom image) keeps the matrix to stock images, and the
      # guard makes the intent explicit: only install when the protocol runs.
      - name: install the extra client for this driver
        run: |
          set -eu
          P=" ${{ matrix.protocols }} "
          has() { case "$P" in *" $1 "*) return 0 ;; *) return 1 ;; esac; }
          # The CI plumbing needs a few basics on a bare image. Install only
          # what is missing, using whichever package manager the image has.
          need=""
          for t in curl wget tar git; do
            command -v "$t" >/dev/null || need="$need $t"
          done
          if [ -n "$need" ]; then
            if command -v apt-get >/dev/null; then
              apt-get update -qq && apt-get install -y -qq $need >/dev/null
            elif command -v apk >/dev/null; then
              apk add --no-cache $need >/dev/null
            elif command -v dnf >/dev/null; then
              dnf install -y -q $need >/dev/null
            elif command -v microdnf >/dev/null; then
              microdnf install -y $need >/dev/null
            elif command -v zypper >/dev/null; then
              zypper -n install $need >/dev/null
            else
              # nixos has no package manager on PATH and DOES already ship
              # curl/wget/tar/git, so reaching here means something else is
              # missing. Report exactly what, then continue: the protocol step
              # will fail with a real error if it truly cannot run.
              echo "WARNING: cannot install:$need (no apt/apk/dnf/zypper)" >&2
            fi
          fi
          # hex's script installs a PREBUILT archive that only exists in the
          # project's own tool image, so fetch it from hex.pm instead.
          if has hex; then
            if [ ! -f /opt/hex-archive/hex.ez ]; then
              mkdir -p /opt/hex-archive
              if command -v curl >/dev/null; then
                curl -fsSL -o /opt/hex-archive/hex.ez \
                  "https://repo.hex.pm/installs/hex-1.x.csv" 2>/dev/null || true
              fi
              # `mix local.hex --force` is the portable way; the script's archive
              # path is only a shortcut when the image bakes it in.
              rm -f /opt/hex-archive/hex.ez
              mix local.hex --force >/dev/null 2>&1 || true
            fi
          fi
          # python3 only where a suite drives the API directly.
          if has swift || has protobuf; then
            if ! command -v python3 >/dev/null && command -v apt-get >/dev/null; then
              apt-get update -qq && apt-get install -y -qq python3 >/dev/null
            fi
          fi
          if has conan; then
            python3 -m pip install --quiet --disable-pip-version-check conan
          fi
          if has luarocks && command -v apt-get >/dev/null; then
            apt-get update -qq && apt-get install -y -qq luarocks lua5.4 >/dev/null
          fi
          if has gitlfs && command -v apt-get >/dev/null; then
            apt-get update -qq && apt-get install -y -qq git-lfs >/dev/null && git lfs install
          fi
          if has juliapkg && command -v apt-get >/dev/null; then
            apt-get update -qq && apt-get install -y -qq ca-certificates >/dev/null
          fi
          if has cran && command -v apt-get >/dev/null; then
            apt-get update -qq && apt-get install -y -qq libcurl4-openssl-dev >/dev/null || true
          fi
          if has protobuf; then
            # `buf build` is what the script asserts with.
            if ! command -v buf >/dev/null; then
              BUF_VER=1.47.2
              curl -fsSL -o /tmp/buf \
                "https://github.com/bufbuild/buf/releases/download/v${BUF_VER}/buf-Linux-x86_64"
              install -m 0755 /tmp/buf /usr/local/bin/buf
            fi
          fi
          echo "installed; tool checks:"
          for t in conan luarocks buf git-lfs; do
            command -v "$t" >/dev/null && echo "  $t: $(command -v "$t")" || true
          done

      # The go protocol script runs `go get`, so the GO toolchain has to be in
      # the image. It is on the runner, not in most images, so add it here.
      - name: install go for the go protocol
        if: contains(matrix.protocols, 'go')
        uses: actions/setup-go@v5
        with:
          go-version-file: go.work
          cache: true

      - name: start easyblobs
        run: |
          set -eu
          chmod +x /tmp/bin/easyblobs-bin
          mkdir -p /tmp/eb-data
          /tmp/bin/easyblobs-bin --listen "0.0.0.0:${EASYBLOBS_PORT}" \
            --data /tmp/eb-data --self-base "http://127.0.0.1:${EASYBLOBS_PORT}" \
            >/tmp/easyblobs.log 2>&1 &
          i=0
          until curl -fsS "http://127.0.0.1:${EASYBLOBS_PORT}/healthz" >/dev/null 2>&1; do
            i=$((i+1)); [ "$i" -gt 120 ] && { cat /tmp/easyblobs.log; exit 1; }
            sleep 0.5
          done
          curl -fsS "http://127.0.0.1:${EASYBLOBS_PORT}/healthz"

      # The runner HAS outbound network, and package managers use it even when
      # told to use a mirror - which is how rubygems/composer "passed" while
      # easyblobs saw zero requests. Give the client a proxy that allows ONLY
      # the mount, so a green result proves the bytes came through easyblobs.
      - name: start the allowlist proxy (mount only, no egress)
        run: |
          set -eu
          ( cd e2e/allowlist-proxy && go mod init allowlistproxy >/dev/null 2>&1 || true )
          ( cd e2e/allowlist-proxy && go build -o /tmp/allowlist-proxy . )
          ALLOWED_HOST="127.0.0.1:${EASYBLOBS_PORT}" LISTEN="127.0.0.1:8888" \
            /tmp/allowlist-proxy >/tmp/allowlist-proxy.log 2>&1 &
          sleep 1
          # Prove it: the mount must pass, the public registry must be denied.
          code=$(curl -sS -o /dev/null -w '%{http_code}' \
            -x http://127.0.0.1:8888 "http://127.0.0.1:${EASYBLOBS_PORT}/healthz" || echo 000)
          echo "  via proxy, mount        -> $code"
          [ "$code" = "200" ] || { echo "FATAL: proxy cannot reach the mount"; cat /tmp/allowlist-proxy.log; exit 1; }
          denied=$(curl -sS -o /dev/null -w '%{http_code}' \
            -x http://127.0.0.1:8888 "https://rubygems.org/" 2>/dev/null || echo 000)
          echo "  via proxy, rubygems.org -> $denied"
          case "$denied" in
            000|403) : ;;
            *) echo "FATAL: the proxy is not blocking egress (got $denied)" >&2; exit 1 ;;
          esac
          {
            # The ORIGIN only: ci-run.sh derives the per-protocol mount
            # (including /maven/_upstream/<host> for the maven-family suites).
            echo "EASYBLOBS_ORIGIN=http://127.0.0.1:${EASYBLOBS_PORT}"
            echo "EASYBLOBS_DATA=/tmp/eb-data"
            echo "EASYBLOBS_ALLOWLIST_PROXY=http://127.0.0.1:8888"
          } >> "$GITHUB_ENV"

      - name: run the real clients
        run: |
          set -u
          fail=""
          for p in ${{ matrix.protocols }}; do
            if ! sh e2e/ci-run.sh "$p"; then
              fail="$fail $p"
            fi
          done
          if [ -n "$fail" ]; then
            echo "FAILED protocols:$fail" >&2
            exit 1
          fi
          echo "all protocols in this driver passed"

      - name: upload server log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: easyblobs-log-${{ strategy.job-index }}
          path: /tmp/easyblobs.log
          if-no-files-found: ignore

