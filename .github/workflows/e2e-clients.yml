name: e2e-clients

# Run every REAL e2e suite against a locally started easyblobs, on GitHub CI.
#
# ARCHITECTURE (one job per protocol):
#
#   clients        ubuntu-latest, the client installed by a GitHub ACTION. Each
#                  step is `if:`-guarded on the protocol, so a job installs only
#                  the one toolchain it needs. This covers every
#                  application-level client (npm, pip, gem, cargo, mvn, cabal,
#                  opam, php/pecl, perl, deno, bazel, nix, lua, dotnet, conda,
#                  buf, R, swift, mix, dart, julia, helm, go).
#
#   distro-clients the three DISTRO package managers, which need their own
#                  userland and cannot be driven from Ubuntu:
#                    apk     apk(8) only exists on Alpine
#                    debian  apt must test Debian's own archive layout
#                    rpm     dnf must test Fedora's own repomd metadata
#                  Running apt/dnf on Ubuntu against a foreign repository would
#                  test the wrong subject, so these keep a container.
#
# Tool versions live in the `env:` block below so they are one place, not
# scattered through the steps.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      only:
        description: "comma-separated protocols (empty = all)"
        required: false
        default: ""

permissions:
  contents: read

env:
  CGO_ENABLED: "0"
  EASYBLOBS_PORT: "8080"
  # Pinned tool versions. Pinned (not `latest`) so a run that goes red means a
  # code problem, not an upstream release; bump these deliberately.
  GO_VERSION_FILE: go.work
  NODE_VERSION: "22"
  PYTHON_VERSION: "3.12"
  JAVA_VERSION: "21"
  DOTNET_VERSION: "9.0.x"
  RUBY_VERSION: "3.3"
  DENO_VERSION: "v2.x"
  HELM_VERSION: "v3.16.4"
  BUF_VERSION: "1.47.2"
  SWIFT_VERSION: "6.0"
  R_VERSION: "4.4"
  OCAML_VERSION: "5.2"
  PHP_VERSION: "8.4"
  PERL_VERSION: "5.40"
  HASKELL_GHC: "9.8"
  JULIA_VERSION: "1"
  BAZEL_VERSION: "8.0.1"
  JENKINS_PLUGIN_MANAGER: "2.12.15"
  SBT_RUNNER_VERSION: "1.10.7"
  # Real, buildable fixture projects per language. ci-run.sh prefers these over
  # the hand-written e2e suites when a fixture exists for the protocol, so the
  # toolchain itself is exercised rather than a purpose-built stub.
  E2E_FIXTURE_REPO: easydev-org/easyblobs-test

jobs:
  # ---------------------------------------------------------------------------
  # Build the server once and share the binary.
  # ---------------------------------------------------------------------------
  server:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.work
          cache: true
      - name: build easyblobs
        run: |
          set -eu
          go build -o easyblobs-bin ./cmd
          ls -lh easyblobs-bin
      - uses: actions/upload-artifact@v4
        with:
          name: easyblobs-bin
          path: easyblobs-bin
          retention-days: 1

  # ---------------------------------------------------------------------------
  # Resolve the matrix from e2e/ci-matrix.tsv (single source of truth).
  # ---------------------------------------------------------------------------
  matrix:
    runs-on: ubuntu-latest
    outputs:
      app: ${{ steps.gen.outputs.app }}
      distro: ${{ steps.gen.outputs.distro }}
    steps:
      - uses: actions/checkout@v4
      - id: gen
        name: build the protocol matrix from e2e/ci-matrix.tsv
        env:
          ONLY: ${{ inputs.only }}
        run: |
          set -eu
          # The generator lives in the repo so it is testable and reviewable,
          # and so the workflow stays free of inline heredocs.
          python3 e2e/genmatrix.py --app  > /tmp/app.json
          python3 e2e/genmatrix.py --distro > /tmp/distro.json
          echo "app=$(cat /tmp/app.json)"       >> "$GITHUB_OUTPUT"
          echo "distro=$(cat /tmp/distro.json)" >> "$GITHUB_OUTPUT"
          echo "app protocols:";    cat /tmp/app.json
          echo "distro protocols:"; cat /tmp/distro.json

  # ---------------------------------------------------------------------------
  # The application-level clients: ubuntu-latest + one action per toolchain.
  # A protocol's install steps are `if:`-guarded, so a job sets up only what its
  # own suite needs.
  # ---------------------------------------------------------------------------
  clients:
    needs: [server, matrix]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.matrix.outputs.app) }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: easyblobs-bin
          path: /tmp/bin

      # ---- toolchains, each guarded by the protocol that needs it ----------
      - uses: actions/setup-go@v5
        if: contains(matrix.protocol, 'go')
        with:
          go-version-file: go.work
          cache: true

      - uses: actions/setup-node@v4
        if: contains(matrix.protocol, 'npm')
        with:
          node-version: ${{ env.NODE_VERSION }}

      - uses: actions/setup-python@v5
        if: contains(matrix.protocol, 'pypi') || contains(matrix.protocol, 'huggingface') || contains(matrix.protocol, 'conan')
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - uses: actions/setup-java@v4
        if: contains(matrix.protocol, 'maven') || contains(matrix.protocol, 'gradle') || contains(matrix.protocol, 'ivy') || contains(matrix.protocol, 'jenkins') || contains(matrix.protocol, 'google') || contains(matrix.protocol, 'clojars') || contains(matrix.protocol, 'spring') || contains(matrix.protocol, 'jitpack')
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - uses: actions/setup-dotnet@v4
        if: contains(matrix.protocol, 'nuget')
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - uses: ruby/setup-ruby@v1
        if: contains(matrix.protocol, 'rubygems')
        with:
          ruby-version: ${{ env.RUBY_VERSION }}

      - uses: dtolnay/rust-toolchain@stable
        if: contains(matrix.protocol, 'cargo')

      - uses: denoland/setup-deno@v2
        if: contains(matrix.protocol, 'jsr')
        with:
          deno-version: ${{ env.DENO_VERSION }}

      - uses: azure/setup-helm@v4
        if: contains(matrix.protocol, 'helm')
        with:
          version: ${{ env.HELM_VERSION }}

      - uses: erlef/setup-beam@v1
        if: contains(matrix.protocol, 'hex')
        with:
          otp-version: "27"
          elixir-version: "1.17"

      - uses: dart-lang/setup-dart@v1
        if: contains(matrix.protocol, 'pub')

      - uses: julia-actions/setup-julia@v2
        if: contains(matrix.protocol, 'juliapkg')
        with:
          version: ${{ env.JULIA_VERSION }}

      - uses: haskell-actions/setup@v2
        if: contains(matrix.protocol, 'hackage') || contains(matrix.protocol, 'stackage')
        with:
          ghc-version: ${{ env.HASKELL_GHC }}
          cabal-version: latest

      - uses: ocaml/setup-ocaml@v3
        if: contains(matrix.protocol, 'opam')
        with:
          ocaml-compiler: ${{ env.OCAML_VERSION }}

      - uses: shivammathur/setup-php@v2
        if: contains(matrix.protocol, 'pecl')
        with:
          php-version: ${{ env.PHP_VERSION }}
          tools: pecl, phpize

      - uses: shogo82148/actions-setup-perl@v1
        if: contains(matrix.protocol, 'cpan')
        with:
          perl-version: ${{ env.PERL_VERSION }}

      - uses: cachix/install-nix-action@v30
        if: contains(matrix.protocol, 'nix')

      - uses: leafo/gh-actions-lua@v10
        if: contains(matrix.protocol, 'luarocks')
        with:
          luaVersion: "5.4"
      - uses: leafo/gh-actions-luarocks@v4
        if: contains(matrix.protocol, 'luarocks')

      - name: install the Lua headers luarocks needs to build a rock
        if: contains(matrix.protocol, 'luarocks')
        run: |
          set -eu
          # luafilesystem is a C extension: luarocks runs a compiler and needs
          # lua.h. Without it:
          #   Error: Failed finding Lua header files. You may need to install
          #   them or configure LUA_INCDIR.
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq \
            liblua5.4-dev build-essential >/dev/null
          # Tell the suite where the headers landed.
          INC=$(dirname "$(find /usr/include -name lua.h | head -1)")
          echo "LUA_INCDIR=${INC:-/usr/include/lua5.4}" >> "$GITHUB_ENV"
          echo "lua headers: ${INC:-not found}"

      - uses: bazel-contrib/setup-bazel@0.8.5
        if: contains(matrix.protocol, 'bazel')
        with:
          bazelisk-cache: true

      - name: install buf
        if: contains(matrix.protocol, 'protobuf')
        run: |
          set -eu
          # NOT bufbuild/buf-setup-action: it resolves the release through the
          # GitHub API and dies on the shared-runner rate limit:
          #   API rate limit exceeded for 52.160.160.242
          # Downloading the release asset directly avoids the API entirely.
          V="${{ env.BUF_VERSION }}"
          curl -fsSL -o /tmp/buf \
            "https://github.com/bufbuild/buf/releases/download/v${V}/buf-Linux-x86_64"
          install -m 0755 /tmp/buf /usr/local/bin/buf
          buf --version
          # The e2e suite drives the REAL buf CLI when BUF_BIN is set, so the
          # publish path is exercised by the actual client and not only by a
          # hand-built Connect request.
          echo "BUF_BIN=/usr/local/bin/buf" >> "$GITHUB_ENV"
          # `buf push` takes a SOURCE DIRECTORY, not a URL; the registry comes
          # from the module name in buf.yaml (<host>/<owner>/<repo>). So the
          # mirror needs a HOSTNAME the CLI can resolve, pointing at this job's
          # own server.
          BSR_HOST="bsr.easyblobs.test"
          if ! grep -q "$BSR_HOST" /etc/hosts 2>/dev/null; then
            echo "127.0.0.1 $BSR_HOST" | sudo tee -a /etc/hosts >/dev/null
          fi
          getent hosts "$BSR_HOST" || true
          echo "BUF_REGISTRY_HOST=$BSR_HOST" >> "$GITHUB_ENV"
          # No TLS terminator and no certificate: buf supports plain HTTP when
          # its global config says 'tls: { use: false }' (connectclient picks
          # PrependHTTP when config.TLS is nil, and certclient returns nil for
          # that setting). The e2e suite writes that config file itself.
          echo "BUF_REGISTRY_PORT=${EASYBLOBS_PORT}" >> "$GITHUB_ENV"

      - uses: r-lib/actions/setup-r@v2
        if: contains(matrix.protocol, 'cran')
        with:
          r-version: ${{ env.R_VERSION }}

      - uses: swift-actions/setup-swift@v2
        if: contains(matrix.protocol, 'swift')
        with:
          swift-version: ${{ env.SWIFT_VERSION }}

      - uses: conda-incubator/setup-miniconda@v3
        if: contains(matrix.protocol, 'conda')
        with:
          miniforge-version: latest
          activate-environment: e2e

      - name: install php + composer runtime
        if: contains(matrix.protocol, 'composer')
        # ramsey/composer-install is deliberately NOT used: it insists on a
        # composer.json in the repository, while this suite creates its own
        # project in a temp directory. setup-php provides composer and php, and
        # the suite drives them itself - which is what is under test anyway.
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          tools: composer

      - name: install sbt runner for ivy
        if: contains(matrix.protocol, 'ivy')
        uses: sbt/setup-sbt@v1
        with:
          sbt-runner-version: ${{ env.SBT_RUNNER_VERSION }}
          # install-dir has NO default in this action and it rejects an empty
          # value:
          #   install-dir must be non-empty and contain only [A-Za-z0-9._/$~-]
          install-dir: ${{ github.workspace }}/.sbt-runner

      - name: install jenkins-plugin-cli
        if: contains(matrix.protocol, 'jenkins')
        run: |
          set -eu
          V="${{ env.JENKINS_PLUGIN_MANAGER }}"
          curl -fsSL -o /opt/jpm.jar \
            "https://github.com/jenkinsci/plugin-installation-manager-tool/releases/download/${V}/jenkins-plugin-manager-${V}.jar"
          printf '%s\n' '#!/bin/sh' 'exec java -jar /opt/jpm.jar "$@"' > /usr/local/bin/jenkins-plugin-cli
          chmod +x /usr/local/bin/jenkins-plugin-cli
          jenkins-plugin-cli --version || true

      - name: install conan
        if: contains(matrix.protocol, 'conan')
        run: python3 -m pip install --quiet --disable-pip-version-check conan

      # ---- the server + the suite ----------------------------------------
      - name: start easyblobs
        run: |
          set -eu
          chmod +x /tmp/bin/easyblobs-bin
          mkdir -p /tmp/eb-data
          # EASYBLOBS_DEBUG makes the server log every request, which the cache
          # assertions rely on when a protocol looks like it stored nothing.
          EASYBLOBS_DEBUG=1 /tmp/bin/easyblobs-bin --listen "0.0.0.0:${EASYBLOBS_PORT}" \
            --data /tmp/eb-data --self-base "http://127.0.0.1:${EASYBLOBS_PORT}" \
            >/tmp/easyblobs.log 2>&1 &
          i=0
          until curl -fsS --noproxy '*' "http://127.0.0.1:${EASYBLOBS_PORT}/healthz" >/dev/null 2>&1; do
            i=$((i+1)); [ "$i" -gt 120 ] && { cat /tmp/easyblobs.log; exit 1; }
            sleep 0.5
          done
          curl -fsS --noproxy '*' "http://127.0.0.1:${EASYBLOBS_PORT}/healthz"
          {
            echo "EASYBLOBS_ORIGIN=http://127.0.0.1:${EASYBLOBS_PORT}"
            echo "EASYBLOBS_DATA=/tmp/eb-data"
          } >> "$GITHUB_ENV"

      - name: clone the fixture repository
        run: |
          set -eu
          # Real, buildable projects per language (easydev-org/easyblobs-test).
          # ci-run.sh prefers a fixture over the hand-written suite when one
          # exists for the protocol, so the toolchain itself is exercised.
          if git clone --depth 1 --quiet \
               "https://github.com/${E2E_FIXTURE_REPO}.git" /tmp/fixtures; then
            echo "E2E_FIXTURES=/tmp/fixtures" >> "$GITHUB_ENV"
            ls /tmp/fixtures | head -30
          else
            echo "NOTE: no fixture repository; falling back to the hand-written suites"
          fi

      - name: run the real client
        run: |
          set -u
          echo "ORIGIN=${EASYBLOBS_ORIGIN:-unset}"
          echo "protocol=${{ matrix.protocol }}"
          sh -x e2e/ci-run.sh "${{ matrix.protocol }}"

      - name: upload the server log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: easyblobs-log-${{ matrix.protocol }}
          path: /tmp/easyblobs.log
          if-no-files-found: ignore

  # ---------------------------------------------------------------------------
  # STEP ONE of moving the toolchains onto easysetup.
  #
  # easysetup publishes pinned, prebuilt toolchains, so a job can ask for
  # "node-26 python-3.13" and get exactly those versions instead of relying on
  # whatever a setup-* action resolves that day. Its artifacts are built for
  # debian 13 (trixie, glibc 2.41) - and that is a HARD constraint: on an older
  # glibc every binary dies at the loader. The `clients` job runs on
  # ubuntu-latest (glibc 2.39), which is exactly why this is a SEPARATE job in a
  # trixie container rather than a switch flipped for all 42 protocols.
  #
  # The point of this job is to prove the whole chain end to end before anything
  # migrates:
  #     easysetup installs a toolchain -> THAT toolchain builds a real project
  #     from easyblobs-test -> it publishes through the mount -> reads it back.
  # It is deliberately small and does not gate the other jobs.
  # ---------------------------------------------------------------------------
  verify-easysetup:
    needs: [server]
    runs-on: ubuntu-latest
    container:
      # trixie, because easysetup's binaries are linked against its glibc 2.41.
      image: debian:trixie-slim
    strategy:
      fail-fast: false
      matrix:
        include:
          # The PROTOCOL is npm (the mount path and the name in
          # e2e/ci-matrix.tsv); node is the fixture directory, and
          # fixture_dir_for_protocol() maps npm -> node.
          - protocol: npm
            tools: "node-26"
          # The PROTOCOL is pypi (that is the mount's path and the name in
          # e2e/ci-matrix.tsv); python is only the fixture directory, and
          # fixture_for() already maps pypi -> python.
          - protocol: pypi
            tools: "python-3.13"
          - protocol: go
            tools: "go-1.27"
          - protocol: maven
            tools: "java-21 maven-3.10"
          - protocol: rubygems
            tools: "ruby-3.4"
          # ---- second wave -------------------------------------------------
          # Only protocols whose adapter has a WRITE path are here: a fixture
          # that builds a package and then finds nowhere to publish it proves
          # nothing about the registry. Checked in the adapter source:
          #   conda  PUT  _hosted/<repo>/<native path>
          #   nuget  PUT  /v3/package          (the flat container is read-only)
          #   composer PUT api/packages
          #   hex    POST /publish?name&version
          #   helm   POST api/charts
          # Read-only mirrors (cran, juliapkg, pecl, luarocks, bazel, nix) stay
          # on their hand-written suites.
          - protocol: conda
            tools: "conda-26"
          - protocol: nuget
            tools: "dotnet-10"
          - protocol: composer
            # composer is a PHP tool; the fixture runs `composer install` and
            # `php main.php`, so both tools come from easysetup.
            tools: "php-8.5"
          - protocol: hex
            tools: "elixir-1.20 erlang-29"
          - protocol: helm
            tools: "helm-4"
          - protocol: cargo
            tools: "rust-1.99"
    steps:
      - uses: actions/checkout@v4

      # The toolchain comes ENTIRELY from easysetup: no setup-go/setup-node/...,
      # and no apt package for the language itself.
      - uses: easydev-org/easysetup@main
        with:
          tools: ${{ matrix.tools }}

      # debian:trixie-slim is deliberately bare. easysetup only installs what
      # ITS INSTALLER needs (curl, xz, python3); everything a build needs at run
      # time has to be here, or a failure would look like an easysetup problem
      # when it is a missing library.
      #   ca-certificates curl git zip unzip  - fetching and unpacking fixtures
      #   build-essential                     - any native build step
      #   python3 python3-pip                 - the suites' own helpers
      #   jq                                  - the suites parse JSON with it
      - name: install what building a project needs (not the toolchains)
        run: |
          set -eu
          export DEBIAN_FRONTEND=noninteractive
          apt-get update -qq
          apt-get install -y -qq --no-install-recommends \
            ca-certificates curl git zip unzip build-essential \
            python3 python3-pip jq
          # Runtime shared libraries the toolchains link against. install.sh
          # installs each entry's apt_deps, but that runs INSIDE the action and
          # its apt output is swallowed by the `curl | bash` pipe, so a miss there
          # only surfaces much later as "libyaml-0.so.2: cannot open shared object
          # file" from the middle of ruby. Installing them explicitly here makes
          # the job depend on what it can see, and an easysetup miss shows up as a
          # harmless duplicate instead of a mystery.
          apt-get install -y -qq --no-install-recommends \
            libyaml-0-2 libssl3 zlib1g libffi8 libgmp10 libreadline8 \
            libbz2-1.0 liblzma5 libsqlite3-0 libatomic1 \
            libicu-dev
          # libicu needs its soname package, not just the -dev one, and dotnet
          # fails hard without it:
          #   Couldn't find a valid ICU package installed on the system.
          # easysetup lists libicu76 in dotnet's apt_deps, but a CACHE HIT skips
          # install.sh entirely, so the deps are never installed on a rerun.
          apt-get install -y -qq --no-install-recommends libicu76 2>/dev/null || \
            apt-get install -y -qq --no-install-recommends libicu72 2>/dev/null || \
            echo "NOTE: no libicu7x package found; dotnet will need invariant globalization"
          # php links libxml2; the same cache-hit-skips-apt_deps problem as ICU:
          #   php: error while loading shared libraries: libxml2.so.2
          apt-get install -y -qq --no-install-recommends libxml2 libcurl4 2>/dev/null || true
          echo "build prerequisites present"

      - name: prove the toolchain is the easysetup one
        shell: bash
        run: |
          set -eu
          . /opt/setup/env.sh
          # easysetup appends "/opt/setup/*/bin" to $GITHUB_PATH and to PATH, but
          # not every toolchain keeps its binary in bin/. dotnet ships the
          # executable at the ROOT of its directory (<id>/dotnet), so the
          # appended bin/ is empty and the tool looks uninstalled:
          #     ./publish.sh: 7: dotnet: not found
          # Add every "root that has an executable directly in it" as well. This
          # is a workaround for a gap in easysetup, not a property of dotnet.
          for d in /opt/setup/*/; do
            [ -d "$d" ] || continue
            [ -f "$d/.easysetup" ] || continue
            case ":${PATH}:" in *":${d%/}:"*) continue ;; esac
            # only add it if the directory itself holds executables
            if [ -n "$(find "$d" -maxdepth 1 -type f -perm -u+x 2>/dev/null | head -1)" ]; then
              export PATH="${d%/}:$PATH"
              echo "$d" >> "$GITHUB_PATH"
              echo "added ${d%/} to PATH (toolchain keeps its binary at the root)"
            fi
          done
          echo "matrix.tools = ${{ matrix.tools }}"
          for d in /opt/setup/*/; do
            [ -d "$d" ] || continue
            [ -f "$d/.easysetup" ] || continue
            echo "installed: $(basename "$d")"
          done
          # Print the versions the tools report, so a silently-wrong toolchain is
          # visible in the log rather than only in a later failure.
          for c in node python3 go java mvn ruby dotnet composer mix conda helm cargo; do
            # The `|| true` matters: this job asks easysetup for ONE toolchain, so
            # most of these names do not exist, and under `set -e` the last
            # `command -v` returning 1 killed the step with exit 127. That is a
            # bug in this reporting loop, not in the toolchain - and it hid the
            # fact that node and python3 had already printed their versions.
            if command -v "$c" >/dev/null 2>&1; then
              printf '%-8s ' "$c"
              "$c" --version 2>&1 | head -1 || true
            else
              printf '%-8s (not installed by this matrix entry)\n' "$c"
            fi
          done

      - uses: actions/download-artifact@v4
        with:
          name: easyblobs-bin
          path: /tmp/bin

      - name: start easyblobs
        run: |
          set -eu
          chmod +x /tmp/bin/easyblobs-bin
          mkdir -p /tmp/eb-data
          EASYBLOBS_DEBUG=1 /tmp/bin/easyblobs-bin --listen "0.0.0.0:${EASYBLOBS_PORT}" \
            --data /tmp/eb-data --self-base "http://127.0.0.1:${EASYBLOBS_PORT}" \
            >/tmp/easyblobs.log 2>&1 &
          i=0
          until curl -fsS --noproxy '*' "http://127.0.0.1:${EASYBLOBS_PORT}/healthz" >/dev/null 2>&1; do
            i=$((i+1)); [ "$i" -gt 120 ] && { cat /tmp/easyblobs.log; exit 1; }
            sleep 0.5
          done
          {
            echo "EASYBLOBS_ORIGIN=http://127.0.0.1:${EASYBLOBS_PORT}"
            echo "EASYBLOBS_DATA=/tmp/eb-data"
          } >> "$GITHUB_ENV"

      - name: clone the fixture repository
        run: |
          set -eu
          # Report WHY it failed instead of a bare "required for this job": in a
          # slim container the usual reasons are a missing git, a missing CA
          # bundle, or no network - and all three look identical from the exit
          # status alone.
          if git clone --depth 1 --quiet \
               "https://github.com/${E2E_FIXTURE_REPO}.git" /tmp/fixtures; then
            echo "E2E_FIXTURES=/tmp/fixtures" >> "$GITHUB_ENV"
          else
            echo "::error::could not clone ${E2E_FIXTURE_REPO}; diagnostics:" >&2
            { command -v git && git --version; } 2>&1 | sed 's/^/  git: /' >&2 || true
            ls -l /etc/ssl/certs/ca-certificates.crt 2>&1 | sed 's/^/  ca: /' >&2 || true
            getent hosts github.com 2>&1 | sed 's/^/  dns: /' >&2 || true
            exit 1
          fi

      # The payload: the toolchain easysetup installed builds the real project,
      # publishes through the mount and reads it back.
      - name: build and publish with the easysetup toolchain
        # env.sh is BASH: it defines functions and uses `local`. The default
        # shell here is `sh -e`, where sourcing it dies quietly and leaves the
        # toolchain off PATH - which surfaces as "dotnet: not found" from inside
        # the fixture and looks like easysetup failing to install.
        shell: bash
        run: |
          set -eu
          # env.sh is what puts the toolchain on PATH; sourcing it here is the
          # difference between "easysetup installed node" and "node runs".
          . /opt/setup/env.sh
          # Same root-level-binary gap as above: $GITHUB_PATH only affects LATER
          # steps, so this step needs the path itself.
          for d in /opt/setup/*/; do
            [ -d "$d" ] || continue
            [ -f "$d/.easysetup" ] || continue
            if [ -n "$(find "$d" -maxdepth 1 -type f -perm -u+x 2>/dev/null | head -1)" ]; then
              export PATH="${d%/}:$PATH"
            fi
          done
          echo "PATH=$PATH"
          sh -x e2e/ci-run.sh "${{ matrix.protocol }}"

      - name: upload the server log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: easyblobs-log-easysetup-${{ matrix.protocol }}
          path: /tmp/easyblobs.log
          if-no-files-found: ignore

  # ---------------------------------------------------------------------------
  # The distro package managers: they must run in the userland they test.
  # ---------------------------------------------------------------------------
  distro-clients:
    needs: [server, matrix]
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.matrix.outputs.distro) }}
    container:
      image: ${{ matrix.image }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: easyblobs-bin
          path: /tmp/bin

      - name: install the basics this image lacks
        run: |
          set -eu
          need=""
          for t in curl wget tar; do
            command -v "$t" >/dev/null || need="$need $t"
          done
          if [ -n "$need" ]; then
            if command -v apk >/dev/null; then
              apk add --no-cache $need
            elif command -v apt-get >/dev/null; then
              apt-get update -qq && apt-get install -y -qq $need >/dev/null
            elif command -v dnf >/dev/null; then
              dnf install -y -q $need >/dev/null
            fi
          fi

      - name: start easyblobs
        run: |
          set -eu
          chmod +x /tmp/bin/easyblobs-bin
          mkdir -p /tmp/eb-data
          EASYBLOBS_DEBUG=1 /tmp/bin/easyblobs-bin --listen "0.0.0.0:${EASYBLOBS_PORT}" \
            --data /tmp/eb-data --self-base "http://127.0.0.1:${EASYBLOBS_PORT}" \
            >/tmp/easyblobs.log 2>&1 &
          i=0
          until curl -fsS --noproxy '*' "http://127.0.0.1:${EASYBLOBS_PORT}/healthz" >/dev/null 2>&1; do
            i=$((i+1)); [ "$i" -gt 120 ] && { cat /tmp/easyblobs.log; exit 1; }
            sleep 0.5
          done
          curl -fsS --noproxy '*' "http://127.0.0.1:${EASYBLOBS_PORT}/healthz"
          {
            echo "EASYBLOBS_ORIGIN=http://127.0.0.1:${EASYBLOBS_PORT}"
            echo "EASYBLOBS_DATA=/tmp/eb-data"
          } >> "$GITHUB_ENV"

      - name: clone the fixture repository
        run: |
          set -eu
          # Inside the distro image: the fixtures are plain source trees, so they
          # work the same way here.
          if command -v git >/dev/null && \
             git clone --depth 1 --quiet \
               "https://github.com/${E2E_FIXTURE_REPO}.git" /tmp/fixtures; then
            echo "E2E_FIXTURES=/tmp/fixtures" >> "$GITHUB_ENV"
          else
            echo "NOTE: no fixture repository; falling back to the hand-written suites"
          fi

      - name: run the real client
        run: |
          set -u
          echo "protocol=${{ matrix.protocol }} image=${{ matrix.image }}"
          sh -x e2e/ci-run.sh "${{ matrix.protocol }}"

      - name: upload the server log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: easyblobs-log-${{ matrix.protocol }}
          path: /tmp/easyblobs.log
          if-no-files-found: ignore
