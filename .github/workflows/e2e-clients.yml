name: e2e-clients

# Run every REAL e2e suite against a locally started easyblobs, on GitHub CI.
#
# ARCHITECTURE (one job per protocol):
#
#   clients        ubuntu-latest, the client installed by a GitHub ACTION. Each
#                  step is `if:`-guarded on the protocol, so a job installs only
#                  the one toolchain it needs. This covers every
#                  application-level client (npm, pip, gem, cargo, mvn, cabal,
#                  opam, php/pecl, perl, deno, bazel, nix, lua, dotnet, conda,
#                  buf, R, swift, mix, dart, julia, helm, go).
#
#   distro-clients the three DISTRO package managers, which need their own
#                  userland and cannot be driven from Ubuntu:
#                    apk     apk(8) only exists on Alpine
#                    debian  apt must test Debian's own archive layout
#                    rpm     dnf must test Fedora's own repomd metadata
#                  Running apt/dnf on Ubuntu against a foreign repository would
#                  test the wrong subject, so these keep a container.
#
# Tool versions live in the `env:` block below so they are one place, not
# scattered through the steps.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      only:
        description: "comma-separated protocols (empty = all)"
        required: false
        default: ""

permissions:
  contents: read

env:
  CGO_ENABLED: "0"
  EASYBLOBS_PORT: "8080"
  # Pinned tool versions. Pinned (not `latest`) so a run that goes red means a
  # code problem, not an upstream release; bump these deliberately.
  GO_VERSION_FILE: go.work
  NODE_VERSION: "22"
  PYTHON_VERSION: "3.12"
  JAVA_VERSION: "21"
  DOTNET_VERSION: "9.0.x"
  RUBY_VERSION: "3.3"
  DENO_VERSION: "v2.x"
  HELM_VERSION: "v3.16.4"
  BUF_VERSION: "1.47.2"
  SWIFT_VERSION: "6.0"
  R_VERSION: "4.4"
  OCAML_VERSION: "5.2"
  PHP_VERSION: "8.4"
  PERL_VERSION: "5.40"
  HASKELL_GHC: "9.8"
  JULIA_VERSION: "1"
  BAZEL_VERSION: "8.0.1"
  JENKINS_PLUGIN_MANAGER: "2.12.15"
  SBT_RUNNER_VERSION: "1.10.7"
  # Real, buildable fixture projects per language. ci-run.sh prefers these over
  # the hand-written e2e suites when a fixture exists for the protocol, so the
  # toolchain itself is exercised rather than a purpose-built stub.
  E2E_FIXTURE_REPO: easydev-org/easyblobs-test

jobs:
  # ---------------------------------------------------------------------------
  # Build the server once and share the binary.
  # ---------------------------------------------------------------------------
  server:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.work
          cache: true
      - name: build easyblobs
        run: |
          set -eu
          go build -o easyblobs-bin ./cmd
          ls -lh easyblobs-bin
      - uses: actions/upload-artifact@v4
        with:
          name: easyblobs-bin
          path: easyblobs-bin
          retention-days: 1

  # ---------------------------------------------------------------------------
  # Resolve the matrix from e2e/ci-matrix.tsv (single source of truth).
  # ---------------------------------------------------------------------------
  matrix:
    runs-on: ubuntu-latest
    outputs:
      app: ${{ steps.gen.outputs.app }}
      hosted: ${{ steps.gen.outputs.hosted }}
      distro: ${{ steps.gen.outputs.distro }}
    steps:
      - uses: actions/checkout@v4
      - id: gen
        name: build the protocol matrix from e2e/ci-matrix.tsv
        env:
          ONLY: ${{ inputs.only }}
        run: |
          set -eu
          # The generator lives in the repo so it is testable and reviewable,
          # and so the workflow stays free of inline heredocs.
          python3 e2e/genmatrix.py --app  > /tmp/app.json
          python3 e2e/genmatrix.py --hosted > /tmp/hosted.json
          python3 e2e/genmatrix.py --distro > /tmp/distro.json
          echo "app=$(cat /tmp/app.json)"       >> "$GITHUB_OUTPUT"
          # hosted was generated and printed but never PUBLISHED as an output,
          # so needs.matrix.outputs.hosted was always empty and the hosted job
          # expanded to zero entries. Every protocol marked "hosted" was
          # therefore only ever exercised by its clients (pull) job, whose
          # E2E_DIRECTION is hardcoded to pull - which is exactly how nix ended
          # up "passing" while its new hosted assertions never ran as a hosted
          # job. The declared outputs and the emitted ones have to agree.
          echo "hosted=$(cat /tmp/hosted.json)" >> "$GITHUB_OUTPUT"
          echo "distro=$(cat /tmp/distro.json)" >> "$GITHUB_OUTPUT"
          echo "pull-through protocols:"; cat /tmp/app.json
          echo "hosted protocols:";       cat /tmp/hosted.json
          echo "distro protocols:";       cat /tmp/distro.json

  # ---------------------------------------------------------------------------
  # PULL-THROUGH: a real client asks the mount for an UPSTREAM package.
  #
  # This is the half of a mirror's job that "it can publish" does not cover:
  # without it the mount is only a place to put files. Each suite installs a
  # package that exists on the public registry (npm: left-pad, go:
  # golang.org/x/text, rubygems: colorize, ...) and then USES it, and the harness
  # additionally asserts the mount stored something - otherwise an adapter that
  # merely proxies would pass.
  #
  # Its own job, separate from `hosted`, because it depends on the public
  # internet: a flaky github.com must not redden a hosted result that never
  # touches the network.
  # ---------------------------------------------------------------------------
  clients:
    needs: [server, matrix]
    runs-on: ubuntu-latest
    env:
      E2E_DIRECTION: pull
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.matrix.outputs.app) }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: easyblobs-bin
          path: /tmp/bin
      # Every toolchain, from easysetup and from nothing else.
      #
      # This job used to carry 25 third-party setup actions - one per
      # language, plus two `pip install` / `curl` steps for conan and
      # jenkins - each resolving whatever version it felt like that day.
      # easysetup pins them: a prebuilt nix closure per tool, one download
      # and one unpack, no compilation at install time.
      #
      # The tool list is chosen from the protocol: the matrix decides which
      # of these applies, and a protocol with no entry installs nothing.
      - uses: easydev-org/easysetup@main
        # oci and netcache need no toolchain: their suites use
        # curl and the mount itself. easysetup refuses an empty
        # list, so the step is skipped rather than called with nothing.
        if: matrix.tools != ''
        with:
          tools: ${{ matrix.tools }}


      # ---- the server + the suite ----------------------------------------
      - name: start easyblobs
        run: |
          set -eu
          chmod +x /tmp/bin/easyblobs-bin
          mkdir -p /tmp/eb-data
          # EASYBLOBS_DEBUG makes the server log every request, which the cache
          # assertions rely on when a protocol looks like it stored nothing.
          EASYBLOBS_DEBUG=1 /tmp/bin/easyblobs-bin --listen "0.0.0.0:${EASYBLOBS_PORT}" \
            --data /tmp/eb-data --self-base "http://127.0.0.1:${EASYBLOBS_PORT}" \
            >/tmp/easyblobs.log 2>&1 &
          i=0
          until curl -fsS --noproxy '*' "http://127.0.0.1:${EASYBLOBS_PORT}/healthz" >/dev/null 2>&1; do
            i=$((i+1)); [ "$i" -gt 120 ] && { cat /tmp/easyblobs.log; exit 1; }
            sleep 0.5
          done
          curl -fsS --noproxy '*' "http://127.0.0.1:${EASYBLOBS_PORT}/healthz"
          {
            echo "EASYBLOBS_ORIGIN=http://127.0.0.1:${EASYBLOBS_PORT}"
            echo "EASYBLOBS_DATA=/tmp/eb-data"
          } >> "$GITHUB_ENV"

      # NO fixture clone here: this job only fetches from upstream, and the
      # fixtures are publish-side projects. The `hosted` job clones them.
      - name: fetch an upstream package with the real client
        run: |
          set -u
          echo "ORIGIN=${EASYBLOBS_ORIGIN:-unset}"
          echo "protocol=${{ matrix.protocol }} direction=pull"
          sh -x e2e/ci-run.sh "${{ matrix.protocol }}"

      - name: upload the server log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: easyblobs-log-${{ matrix.protocol }}
          path: /tmp/easyblobs.log
          if-no-files-found: ignore

  hosted:
    needs: [server, matrix]
    runs-on: ubuntu-latest
    env:
      E2E_DIRECTION: hosted
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.matrix.outputs.hosted) }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: easyblobs-bin
          path: /tmp/bin
      # Every toolchain, from easysetup and from nothing else.
      #
      # This job used to carry 25 third-party setup actions - one per
      # language, plus two `pip install` / `curl` steps for conan and
      # jenkins - each resolving whatever version it felt like that day.
      # easysetup pins them: a prebuilt nix closure per tool, one download
      # and one unpack, no compilation at install time.
      #
      # The tool list is chosen from the protocol: the matrix decides which
      # of these applies, and a protocol with no entry installs nothing.
      - uses: easydev-org/easysetup@main
        # oci and netcache need no toolchain: their suites use
        # curl and the mount itself. easysetup refuses an empty
        # list, so the step is skipped rather than called with nothing.
        if: matrix.tools != ''
        with:
          tools: ${{ matrix.tools }}


      # ---- the server + the suite ----------------------------------------
      - name: start easyblobs
        run: |
          set -eu
          chmod +x /tmp/bin/easyblobs-bin
          mkdir -p /tmp/eb-data
          EASYBLOBS_DEBUG=1 /tmp/bin/easyblobs-bin --listen "0.0.0.0:${EASYBLOBS_PORT}" \
            --data /tmp/eb-data --self-base "http://127.0.0.1:${EASYBLOBS_PORT}" \
            >/tmp/easyblobs.log 2>&1 &
          i=0
          until curl -fsS --noproxy '*' "http://127.0.0.1:${EASYBLOBS_PORT}/healthz" >/dev/null 2>&1; do
            i=$((i+1)); [ "$i" -gt 120 ] && { cat /tmp/easyblobs.log; exit 1; }
            sleep 0.5
          done
          {
            echo "EASYBLOBS_ORIGIN=http://127.0.0.1:${EASYBLOBS_PORT}"
            echo "EASYBLOBS_DATA=/tmp/eb-data"
          } >> "$GITHUB_ENV"

      - name: clone the fixture repository
        run: |
          set -eu
          # Required here, unlike the pull job: without it there is nothing to
          # publish, and a silent fallback would turn this job into a no-op.
          git clone --depth 1 --quiet \
            "https://github.com/${E2E_FIXTURE_REPO}.git" /tmp/fixtures
          echo "E2E_FIXTURES=/tmp/fixtures" >> "$GITHUB_ENV"

      - name: publish the fixture and read it back
        run: |
          set -u
          sh -x e2e/ci-run.sh "${{ matrix.protocol }}"

      - name: upload the server log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: easyblobs-log-hosted-${{ matrix.protocol }}
          path: /tmp/easyblobs.log
          if-no-files-found: ignore
  verify-easysetup:
    needs: [server]
    runs-on: ubuntu-latest
    env:
      # HOSTED: these fixtures build and publish their own artefact. The pull
      # direction for the same protocols is covered by `clients`.
      E2E_DIRECTION: hosted
    strategy:
      fail-fast: false
      matrix:
        include:
          # tools: one setup name per toolchain the fixture needs. easysetup
          # publishes one version per tool, so a bare name is exact - there is no
          # version to pin here and nothing to drift.
          #
          # The PROTOCOL is the mount path and the name in e2e/ci-matrix.tsv; the
          # fixture DIRECTORY is different for several of them, and
          # fixture_dir_for_protocol() maps npm->node, pypi->python, etc.
          - { protocol: npm,      tools: "node" }
          # pip is its own setup (pythonPackages.pip). The 'python' setup alone
          # is a bare interpreter with no pip, so a fixture that runs
          # `python -m build` and `twine` needs both names.
          - { protocol: pypi,     tools: "python pip" }
          - { protocol: go,       tools: "go" }
          - { protocol: maven,    tools: "java maven" }
          - { protocol: rubygems, tools: "ruby" }
          # easysetup publishes micromamba for the conda protocol: one static
          # conda-compatible binary, no base install. That is the client to drive.
          - { protocol: conda,    tools: "micromamba" }
          - { protocol: nuget,    tools: "dotnet" }
          - { protocol: composer, tools: "php" }
          - { protocol: hex,      tools: "elixir erlang" }
          - { protocol: helm,     tools: "helm" }
          # cargo is its own setup (pkgs.cargo). 'rust' is pkgs.rustc, the
          # compiler only, so a crate cannot be built or published with it.
          - { protocol: cargo,    tools: "rust cargo" }
    steps:
      - uses: actions/checkout@v4

      # The toolchains come from easydev-org/easysetup and from nothing else.
      #
      # Each setup is a prebuilt nix closure: one download, one unpack, no apt,
      # no compilation, no dependency resolution. The action fetches a static
      # binary, runs `easysetup install <tools>`, and appends the tool
      # directories to $GITHUB_PATH so the next step simply finds them.
      #
      # This job drove the binary itself with sudo for a while, to work around
      # three upstream defects. All three are fixed, and each was re-measured
      # here before the workaround was removed:
      #
      #   checksum parser (63a865ce)  could not read a bare digest, so every
      #                               install died with 'published checksum is
      #                               empty'
      #   tarball pollution (39f52c02) the chroot check copied base and glibc
      #                               into $STAGE/nix/store, so a 3-path setup
      #                               shipped 11
      #   duplicate paths (c064fcff)  a path shared by exactly two setups
      #                               stayed in both own lists, was packaged
      #                               twice, and the second install could not
      #                               write what the first made read-only
      #
      # The last one was NOT a privilege problem, which is what it looked like.
      # Unprivileged install of java+maven, conda, elixir+erlang and python+pip
      # now returns 0 and the resulting tools run: openjdk 25.0.4.1, Maven
      # 3.9.16, conda 26.7.1, Python 3.13.16, pip 26.1.2.
      - uses: easydev-org/easysetup@main
        with:
          tools: ${{ matrix.tools }}

      # Nothing here installs a language. Everything a BUILD needs beyond the
      # toolchain - git, zip, a C toolchain for native extensions, jq for the
      # fixtures - is installed here, and never a language runtime: that is the
      # toolchain's job and easysetup's whole point.
      #
      # `sudo`, because this job now runs on the runner image rather than inside
      # a container as root.
      - name: install what building a project needs (never a toolchain)
        run: |
          set -eu
          sudo env DEBIAN_FRONTEND=noninteractive apt-get update -qq
          sudo env DEBIAN_FRONTEND=noninteractive apt-get install -y -qq \
            --no-install-recommends \
            ca-certificates curl git zip unzip build-essential python3 jq zstd

      - name: show the toolchain easysetup provided
        run: |
          set -eu
          echo "requested: ${{ matrix.tools }}"
          # The registry files are the source of truth for what was unpacked.
          for f in /nix/setup-root-*; do
            [ -f "$f" ] || continue
            echo "  $(basename "$f"): $(cat "$f")"
          done
          for c in node python3 go java mvn ruby conda dotnet php mix elixir helm cargo composer; do
            if command -v "$c" >/dev/null 2>&1; then
              printf '%-10s %s\n' "$c" "$(command -v "$c")"
            fi
          done

      - uses: actions/download-artifact@v4
        with:
          name: easyblobs-bin
          path: /tmp/bin

      - name: start easyblobs
        run: |
          set -eu
          chmod +x /tmp/bin/easyblobs-bin
          mkdir -p /tmp/eb-data
          EASYBLOBS_DEBUG=1 /tmp/bin/easyblobs-bin --listen "0.0.0.0:${EASYBLOBS_PORT}" \
            --data /tmp/eb-data --self-base "http://127.0.0.1:${EASYBLOBS_PORT}" \
            >/tmp/easyblobs.log 2>&1 &
          i=0
          until curl -fsS --noproxy '*' "http://127.0.0.1:${EASYBLOBS_PORT}/healthz" >/dev/null 2>&1; do
            i=$((i+1)); [ "$i" -gt 120 ] && { cat /tmp/easyblobs.log; exit 1; }
            sleep 0.5
          done
          {
            echo "EASYBLOBS_ORIGIN=http://127.0.0.1:${EASYBLOBS_PORT}"
            echo "EASYBLOBS_DATA=/tmp/eb-data"
          } >> "$GITHUB_ENV"

      - name: clone the fixture repository
        run: |
          set -eu
          if git clone --depth 1 --quiet \
               "https://github.com/${E2E_FIXTURE_REPO}.git" /tmp/fixtures; then
            echo "E2E_FIXTURES=/tmp/fixtures" >> "$GITHUB_ENV"
          else
            echo "::error::could not clone ${E2E_FIXTURE_REPO}; diagnostics:" >&2
            { command -v git && git --version; } 2>&1 | sed 's/^/  git: /' >&2 || true
            ls -l /etc/ssl/certs/ca-certificates.crt 2>&1 | sed 's/^/  ca: /' >&2 || true
            getent hosts github.com 2>&1 | sed 's/^/  dns: /' >&2 || true
            exit 1
          fi

      # The payload: the easysetup toolchain builds the real project, publishes
      # through the mount and reads it back.
      #
      # No sourcing of env.sh: the action already put the tool directories on
      # $GITHUB_PATH, and `shell: bash` is only here because env.sh is bash and
      # the harness may source it for tools that need more than PATH.
      - name: build and publish with the easysetup toolchain
        shell: bash
        run: |
          set -eu
          sh -x e2e/ci-run.sh "${{ matrix.protocol }}"

      - name: upload the server log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: easyblobs-log-easysetup-${{ matrix.protocol }}
          path: /tmp/easyblobs.log
          if-no-files-found: ignore

  distro-clients:
    needs: [server, matrix]
    runs-on: ubuntu-latest
    env:
      # The direction comes from the matrix row. It used to be hardcoded to
      # pull with the note "you cannot publish an .deb through them this way",
      # which is wrong: debian and rpm both have a HostedHandler, both GENERATE
      # their index from what was uploaded (GeneratePackages / GenerateRepodata),
      # and both suites already publish a real .deb/.rpm under _hosted, install
      # it back and run the installed binary. apk stays pull because its hosted
      # install is a documented PARTIAL (abuild is not on PATH).
      E2E_DIRECTION: ${{ matrix.direction }}
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.matrix.outputs.distro) }}
    container:
      image: ${{ matrix.image }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: easyblobs-bin
          path: /tmp/bin

      - name: install the basics this image lacks
        run: |
          set -eu
          need=""
          # bash is NOT optional: the suites are `sh`, but ci-run.sh uses
          # bash-isms and alpine:3.20 ships only busybox sh -
          #   sh: /bin/sh
          #   bash: MISSING
          # so the harness aborted before any protocol ran.
          for t in curl wget tar bash; do
            command -v "$t" >/dev/null || need="$need $t"
          done
          if [ -n "$need" ]; then
            if command -v apk >/dev/null; then
              apk add --no-cache $need
            elif command -v apt-get >/dev/null; then
              apt-get update -qq && apt-get install -y -qq $need >/dev/null
            elif command -v dnf >/dev/null; then
              dnf install -y -q $need >/dev/null
            fi
          fi

      # The hosted cases BUILD a package to publish, so the distro's own
      # packager has to be present: alpine:3.20 and fedora:41 ship neither
      # abuild nor rpmbuild. Pull-only protocols do not need this, but the
      # install is cheap and keeps the matrix uniform.
      - name: install the distro's packager
        run: |
          set -eu
          if command -v apk >/dev/null; then
            apk add --no-cache alpine-sdk build-base 2>/dev/null || true
            # shadow provides useradd, which the arch suite needs to drop root
            # for makepkg.
            apk add --no-cache shadow 2>/dev/null || true
          elif command -v pacman >/dev/null; then
            # makepkg is the reference builder for a .pkg.tar.zst, the same way
            # dpkg-deb and rpmbuild are used for theirs. It arrives with
            # pacman itself; shadow gives the suite useradd.
            pacman -Sy --noconfirm --needed pacman shadow 2>/dev/null || true
          elif command -v dnf >/dev/null; then
            dnf install -y -q rpm-build 2>/dev/null || true
          elif command -v apt-get >/dev/null; then
            apt-get update -qq && apt-get install -y -qq dpkg-dev >/dev/null 2>&1 || true
          fi

      - name: what the packager is
        run: |
          for t in abuild rpmbuild dpkg-deb; do
            if command -v "$t" >/dev/null 2>&1; then
              echo "  $t: $(command -v "$t")"
            fi
          done

      - name: start easyblobs
        run: |
          set -eu
          chmod +x /tmp/bin/easyblobs-bin
          mkdir -p /tmp/eb-data
          EASYBLOBS_DEBUG=1 /tmp/bin/easyblobs-bin --listen "0.0.0.0:${EASYBLOBS_PORT}" \
            --data /tmp/eb-data --self-base "http://127.0.0.1:${EASYBLOBS_PORT}" \
            >/tmp/easyblobs.log 2>&1 &
          i=0
          until curl -fsS --noproxy '*' "http://127.0.0.1:${EASYBLOBS_PORT}/healthz" >/dev/null 2>&1; do
            i=$((i+1)); [ "$i" -gt 120 ] && { cat /tmp/easyblobs.log; exit 1; }
            sleep 0.5
          done
          curl -fsS --noproxy '*' "http://127.0.0.1:${EASYBLOBS_PORT}/healthz"
          {
            echo "EASYBLOBS_ORIGIN=http://127.0.0.1:${EASYBLOBS_PORT}"
            echo "EASYBLOBS_DATA=/tmp/eb-data"
          } >> "$GITHUB_ENV"

      - name: clone the fixture repository
        run: |
          set -eu
          # Inside the distro image: the fixtures are plain source trees, so they
          # work the same way here.
          if command -v git >/dev/null && \
             git clone --depth 1 --quiet \
               "https://github.com/${E2E_FIXTURE_REPO}.git" /tmp/fixtures; then
            echo "E2E_FIXTURES=/tmp/fixtures" >> "$GITHUB_ENV"
          else
            echo "NOTE: no fixture repository; falling back to the hand-written suites"
          fi

      - name: run the real client
        run: |
          set -u
          echo "protocol=${{ matrix.protocol }} image=${{ matrix.image }}"
          sh -x e2e/ci-run.sh "${{ matrix.protocol }}"

      - name: upload the server log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: easyblobs-log-${{ matrix.protocol }}
          path: /tmp/easyblobs.log
          if-no-files-found: ignore
