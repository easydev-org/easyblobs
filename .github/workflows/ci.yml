name: ci

# Check every push and pull request: vet, test, build.
#
# THIS REPOSITORY IS A GO WORKSPACE. There is no root go.mod; go.work `use`s a
# set of sub-directories, each with its own module. That layout is correct and is
# not changed here: it lets the command reference the core library and every
# adapter by path, without publishing intermediate versions to a proxy or
# threading replace directives through thirty modules.
#
# So the toolchain is pinned from go.work, and every step runs at the workspace
# root where ./... spans all modules.
#
# CGO_ENABLED=0 because the binaries run in containers and in guests (bionic,
# musl), where a dynamically linked build fails with a missing interpreter rather
# than an obvious error.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  CGO_ENABLED: "0"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.work
          cache: true

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      # system/ui.go has `//go:embed all:ui/dist`, and that dist/ is produced by
      # Containerfile.build from easyblobs-webui — nothing is committed. Every go
      # command in the `system` module fails until it exists:
      #   system/ui.go:15:12: pattern all:ui/dist: no matching files found
      - name: build the embedded SPA
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # Pin the UI to its newest RELEASE, not to main. A branch tip is
          # not reproducible: this build would embed whatever happened to be
          # pushed, with nothing recording which commit it was.
          u=$(gh release view --repo easydev-org/easyblobs-webui --json tagName -q .tagName) \
            || { echo "::error::easydev-org/easyblobs-webui has no Release to pin to"; exit 1; }
          echo "ui=easydev-org/easyblobs-webui@$u"
          git clone --depth 1 --branch "$u" \
            https://github.com/easydev-org/easyblobs-webui.git /tmp/webui
          cd /tmp/webui
          npm ci --no-audit --no-fund
          mkdir -p "$GITHUB_WORKSPACE/system/ui/dist"
          OUT_DIR="$GITHUB_WORKSPACE/system/ui/dist" npm run build
          echo "SPA files: $(find "$GITHUB_WORKSPACE/system/ui/dist" -type f | wc -l)"

      # `./...` DOES NOT WORK HERE. The workspace root is not itself a module, so
      # the pattern walks out of the workspace:
      #   pattern ./...: directory prefix . does not contain modules listed in
      #   go.work or their selected dependencies
      #
      # The pattern has to name the modules, which go.work already lists. Read the
      # list from the workspace file so adding a module cannot silently drop it
      # from CI.
      - name: list the workspace modules
        id: mods
        run: |
          set -euo pipefail
          mods=$(go work edit -json | python3 -c \
            'import json,sys; print(" ".join(u["DiskPath"].rstrip("/") + "/..." for u in json.load(sys.stdin)["Use"]))')
          echo "modules: $(echo "$mods" | wc -w)"
          echo "mods=$mods" >> "$GITHUB_OUTPUT"

      - run: go vet ${{ steps.mods.outputs.mods }}

      - run: go test ${{ steps.mods.outputs.mods }}

      - run: go build ${{ steps.mods.outputs.mods }}

  # ---------------------------------------------------------------------------
  # The real-client end-to-end suites live in .github/workflows/e2e-clients.yml.
  #
  # They were once ALSO defined here as two hand-written jobs (one hosted tier,
  # one client tier). That duplicated the matrix in two places and the copies
  # drifted: this file kept running an older idea of the suite while
  # e2e-clients.yml ran the real one, so a red here meant nothing. There is now
  # exactly ONE definition (e2e/ci-matrix.tsv -> e2e-clients.yml).
  # ---------------------------------------------------------------------------