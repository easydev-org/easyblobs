name: ci

# Check every push and pull request: vet, test, build.
#
# THIS REPOSITORY IS A GO WORKSPACE. There is no root go.mod; go.work `use`s a
# set of sub-directories, each with its own module. That layout is correct and is
# not changed here: it lets the command reference the core library and every
# adapter by path, without publishing intermediate versions to a proxy or
# threading replace directives through thirty modules.
#
# So the toolchain is pinned from go.work, and every step runs at the workspace
# root where ./... spans all modules.
#
# CGO_ENABLED=0 because the binaries run in containers and in guests (bionic,
# musl), where a dynamically linked build fails with a missing interpreter rather
# than an obvious error.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  CGO_ENABLED: "0"

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.work
          cache: true

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      # system/ui.go has `//go:embed all:ui/dist`, and that dist/ is produced by
      # Containerfile.build from easyblobs-webui — nothing is committed. Every go
      # command in the `system` module fails until it exists:
      #   system/ui.go:15:12: pattern all:ui/dist: no matching files found
      - name: build the embedded SPA
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # Pin the UI to its newest RELEASE, not to main. A branch tip is
          # not reproducible: this build would embed whatever happened to be
          # pushed, with nothing recording which commit it was.
          u=$(gh release view --repo easydev-org/easyblobs-webui --json tagName -q .tagName) \
            || { echo "::error::easydev-org/easyblobs-webui has no Release to pin to"; exit 1; }
          echo "ui=easydev-org/easyblobs-webui@$u"
          git clone --depth 1 --branch "$u" \
            https://github.com/easydev-org/easyblobs-webui.git /tmp/webui
          cd /tmp/webui
          npm ci --no-audit --no-fund
          mkdir -p "$GITHUB_WORKSPACE/system/ui/dist"
          OUT_DIR="$GITHUB_WORKSPACE/system/ui/dist" npm run build
          echo "SPA files: $(find "$GITHUB_WORKSPACE/system/ui/dist" -type f | wc -l)"

      # `./...` DOES NOT WORK HERE. The workspace root is not itself a module, so
      # the pattern walks out of the workspace:
      #   pattern ./...: directory prefix . does not contain modules listed in
      #   go.work or their selected dependencies
      #
      # The pattern has to name the modules, which go.work already lists. Read the
      # list from the workspace file so adding a module cannot silently drop it
      # from CI.
      - name: list the workspace modules
        id: mods
        run: |
          set -euo pipefail
          mods=$(go work edit -json | python3 -c \
            'import json,sys; print(" ".join(u["DiskPath"].rstrip("/") + "/..." for u in json.load(sys.stdin)["Use"]))')
          echo "modules: $(echo "$mods" | wc -w)"
          echo "mods=$mods" >> "$GITHUB_OUTPUT"

      - run: go vet ${{ steps.mods.outputs.mods }}

      - run: go test ${{ steps.mods.outputs.mods }}

      - run: go build ${{ steps.mods.outputs.mods }}

  # ---------------------------------------------------------------------------
  # REAL-CLI end-to-end against a locally started easyblobs (no Kubernetes).
  #
  # TWO tiers, because they need different things:
  #
  #   hosted   HOSTED publish + fetch through the real HTTP surface (PUT then
  #            GET, per protocol). Needs NOTHING but the binary, so it runs on
  #            every push and cannot be skipped. It proves the adapter's own
  #            read/write paths and the CAS.
  #
  #   clients  the actual package managers (npm/pip/helm/cargo/go) INSTALLING a
  #            real package through the pull-through cache. This needs outbound
  #            network to the public upstreams, so it is allowed to skip when
  #            the runner cannot reach them (a fork PR behind a proxy, a
  #            sandboxed runner) instead of failing for the wrong reason.
  #            When it DOES run we also assert the CAS grew, so an adapter that
  #            silently proxies every request cannot pass.
  # ---------------------------------------------------------------------------
  e2e-hosted:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # Protocols whose hosted write path is a plain HTTP PUT of raw bytes.
        protocol: [generic, helm, ivy, pypi]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.work
          cache: true

      - name: start easyblobs
        run: |
          set -euo pipefail
          go build -o /tmp/easyblobs ./cmd
          mkdir -p /tmp/eb-data
          # --self-base matters: adapters embed it in the URLs they advertise
          # (e.g. PyPI's /simple/ hrefs). Without it they emit a localhost:8080
          # default and a real client would follow a dead link.
          /tmp/easyblobs --listen 127.0.0.1:8080 --data /tmp/eb-data \
            --self-base http://127.0.0.1:8080 &
          for i in $(seq 1 50); do
            curl -fsS http://127.0.0.1:8080/healthz >/dev/null 2>&1 && break
            sleep 0.2
          done
          curl -fsS http://127.0.0.1:8080/healthz

      - name: hosted publish + fetch (${{ matrix.protocol }})
        run: bash e2e/hosted.sh "${{ matrix.protocol }}"

      - name: assert the bytes are in the CAS
        run: |
          set -euo pipefail
          n=$(find /tmp/eb-data -type f | grep -vc '\.db' || true)
          echo "CAS files: $n"
          test "$n" -gt 0

  e2e-real-clients:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        client: [npm, pypi, helm, cargo, go]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.work
          cache: true
      - uses: actions/setup-node@v4
        with: { node-version: "22" }
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }

      - name: start easyblobs
        run: |
          set -euo pipefail
          go build -o /tmp/easyblobs ./cmd
          mkdir -p /tmp/eb-data
          /tmp/easyblobs --listen 127.0.0.1:8080 --data /tmp/eb-data \
            --self-base http://127.0.0.1:8080 &
          for i in $(seq 1 50); do
            curl -fsS http://127.0.0.1:8080/healthz >/dev/null 2>&1 && break
            sleep 0.2
          done
          curl -fsS http://127.0.0.1:8080/healthz
          echo "EASYBLOBS_BASE=http://127.0.0.1:8080/artifacts" >> "$GITHUB_ENV"

      - name: can we reach the public upstream?
        id: net
        run: |
          if curl -fsS --max-time 10 https://registry.npmjs.org/ >/dev/null 2>&1; then
            echo "ok=1" >> "$GITHUB_OUTPUT"
          else
            echo "ok=0" >> "$GITHUB_OUTPUT"
            echo "::warning::no outbound network to the public upstreams; skipping the pull-through client test"
          fi

      - name: run the real client (${{ matrix.client }})
        if: steps.net.outputs.ok == '1'
        run: bash "e2e/scripts/${{ matrix.client }}.sh"

      - name: assert the pull was cached
        if: steps.net.outputs.ok == '1'
        run: |
          set -euo pipefail
          n=$(find /tmp/eb-data -type f | grep -vc '\.db' || true)
          echo "CAS files: $n"
          test "$n" -gt 0
