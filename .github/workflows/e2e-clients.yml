name: e2e-clients

# Run every REAL e2e suite against a locally started easyblobs, on GitHub CI.
#
# ARCHITECTURE (one job per protocol):
#
#   clients        ubuntu-latest, the client installed by a GitHub ACTION. Each
#                  step is `if:`-guarded on the protocol, so a job installs only
#                  the one toolchain it needs. This covers every
#                  application-level client (npm, pip, gem, cargo, mvn, cabal,
#                  opam, php/pecl, perl, deno, bazel, nix, lua, dotnet, conda,
#                  buf, R, swift, mix, dart, julia, helm, go).
#
#   distro-clients the three DISTRO package managers, which need their own
#                  userland and cannot be driven from Ubuntu:
#                    apk     apk(8) only exists on Alpine
#                    debian  apt must test Debian's own archive layout
#                    rpm     dnf must test Fedora's own repomd metadata
#                  Running apt/dnf on Ubuntu against a foreign repository would
#                  test the wrong subject, so these keep a container.
#
# Tool versions live in the `env:` block below so they are one place, not
# scattered through the steps.

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      only:
        description: "comma-separated protocols (empty = all)"
        required: false
        default: ""

permissions:
  contents: read

env:
  CGO_ENABLED: "0"
  EASYBLOBS_PORT: "8080"
  # Pinned tool versions. Pinned (not `latest`) so a run that goes red means a
  # code problem, not an upstream release; bump these deliberately.
  GO_VERSION_FILE: go.work
  NODE_VERSION: "22"
  PYTHON_VERSION: "3.12"
  JAVA_VERSION: "21"
  DOTNET_VERSION: "9.0.x"
  RUBY_VERSION: "3.3"
  DENO_VERSION: "v2.x"
  HELM_VERSION: "v3.16.4"
  BUF_VERSION: "1.47.2"
  SWIFT_VERSION: "6.0"
  R_VERSION: "4.4"
  OCAML_VERSION: "5.2"
  PHP_VERSION: "8.4"
  PERL_VERSION: "5.40"
  HASKELL_GHC: "9.8"
  JULIA_VERSION: "1"
  BAZEL_VERSION: "8.0.1"
  JENKINS_PLUGIN_MANAGER: "2.12.15"
  SBT_RUNNER_VERSION: "1.10.7"
  # Real, buildable fixture projects per language. ci-run.sh prefers these over
  # the hand-written e2e suites when a fixture exists for the protocol, so the
  # toolchain itself is exercised rather than a purpose-built stub.
  E2E_FIXTURE_REPO: easydev-org/easyblobs-test

jobs:
  # ---------------------------------------------------------------------------
  # Build the server once and share the binary.
  # ---------------------------------------------------------------------------
  server:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.work
          cache: true
      - name: build easyblobs
        run: |
          set -eu
          go build -o easyblobs-bin ./cmd
          ls -lh easyblobs-bin
      - uses: actions/upload-artifact@v4
        with:
          name: easyblobs-bin
          path: easyblobs-bin
          retention-days: 1

  # ---------------------------------------------------------------------------
  # Resolve the matrix from e2e/ci-matrix.tsv (single source of truth).
  # ---------------------------------------------------------------------------
  matrix:
    runs-on: ubuntu-latest
    outputs:
      app: ${{ steps.gen.outputs.app }}
      hosted: ${{ steps.gen.outputs.hosted }}
      buildonly: ${{ steps.gen.outputs.buildonly }}
      distro: ${{ steps.gen.outputs.distro }}
    steps:
      - uses: actions/checkout@v4
      - id: gen
        name: build the protocol matrix from e2e/ci-matrix.tsv
        env:
          ONLY: ${{ inputs.only }}
        run: |
          set -eu
          # The generator lives in the repo so it is testable and reviewable,
          # and so the workflow stays free of inline heredocs.
          python3 e2e/genmatrix.py --app  > /tmp/app.json
          python3 e2e/genmatrix.py --hosted > /tmp/hosted.json
          python3 e2e/genmatrix.py --distro > /tmp/distro.json
          echo "app=$(cat /tmp/app.json)"       >> "$GITHUB_OUTPUT"
          python3 e2e/genmatrix.py --build-only > /tmp/buildonly.json
          echo "buildonly=$(cat /tmp/buildonly.json)" >> "$GITHUB_OUTPUT"
          echo "hosted=$(cat /tmp/hosted.json)" >> "$GITHUB_OUTPUT"
          echo "distro=$(cat /tmp/distro.json)" >> "$GITHUB_OUTPUT"
          echo "pull-through protocols:"; cat /tmp/app.json
          echo "hosted protocols:";       cat /tmp/hosted.json
          echo "distro protocols:";       cat /tmp/distro.json

  # ---------------------------------------------------------------------------
  # PULL-THROUGH: a real client asks the mount for an UPSTREAM package.
  #
  # This is the half of a mirror's job that "it can publish" does not cover:
  # without it the mount is only a place to put files. Each suite installs a
  # package that exists on the public registry (npm: left-pad, go:
  # golang.org/x/text, rubygems: colorize, ...) and then USES it, and the harness
  # additionally asserts the mount stored something - otherwise an adapter that
  # merely proxies would pass.
  #
  # Its own job, separate from `hosted`, because it depends on the public
  # internet: a flaky github.com must not redden a hosted result that never
  # touches the network.
  # ---------------------------------------------------------------------------
  clients:
    needs: [server, matrix]
    runs-on: ubuntu-latest
    env:
      E2E_DIRECTION: pull
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.matrix.outputs.app) }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: easyblobs-bin
          path: /tmp/bin

      # ---- toolchains, each guarded by the protocol that needs it ----------
      - uses: actions/setup-go@v5
        if: contains(matrix.protocol, 'go')
        with:
          go-version-file: go.work
          cache: true

      - uses: actions/setup-node@v4
        if: contains(matrix.protocol, 'npm')
        with:
          node-version: ${{ env.NODE_VERSION }}

      - uses: actions/setup-python@v5
        if: contains(matrix.protocol, 'pypi') || contains(matrix.protocol, 'huggingface') || contains(matrix.protocol, 'conan')
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - uses: actions/setup-java@v4
        if: contains(matrix.protocol, 'maven') || contains(matrix.protocol, 'gradle') || contains(matrix.protocol, 'ivy') || contains(matrix.protocol, 'jenkins') || contains(matrix.protocol, 'google') || contains(matrix.protocol, 'clojars') || contains(matrix.protocol, 'spring') || contains(matrix.protocol, 'jitpack')
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - uses: actions/setup-dotnet@v4
        if: contains(matrix.protocol, 'nuget')
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - uses: ruby/setup-ruby@v1
        if: contains(matrix.protocol, 'rubygems')
        with:
          ruby-version: ${{ env.RUBY_VERSION }}

      - uses: dtolnay/rust-toolchain@stable
        if: contains(matrix.protocol, 'cargo')

      - uses: denoland/setup-deno@v2
        if: contains(matrix.protocol, 'jsr')
        with:
          deno-version: ${{ env.DENO_VERSION }}

      - uses: azure/setup-helm@v4
        if: contains(matrix.protocol, 'helm')
        with:
          version: ${{ env.HELM_VERSION }}

      - uses: erlef/setup-beam@v1
        if: contains(matrix.protocol, 'hex')
        with:
          otp-version: "27"
          elixir-version: "1.17"

      - uses: dart-lang/setup-dart@v1
        if: contains(matrix.protocol, 'pub')

      - uses: julia-actions/setup-julia@v2
        if: contains(matrix.protocol, 'juliapkg')
        with:
          version: ${{ env.JULIA_VERSION }}

      - uses: haskell-actions/setup@v2
        if: contains(matrix.protocol, 'hackage') || contains(matrix.protocol, 'stackage')
        with:
          ghc-version: ${{ env.HASKELL_GHC }}
          cabal-version: latest

      - uses: ocaml/setup-ocaml@v3
        if: contains(matrix.protocol, 'opam')
        with:
          ocaml-compiler: ${{ env.OCAML_VERSION }}

      - uses: shivammathur/setup-php@v2
        if: contains(matrix.protocol, 'pecl')
        with:
          php-version: ${{ env.PHP_VERSION }}
          tools: pecl, phpize

      - uses: shogo82148/actions-setup-perl@v1
        if: contains(matrix.protocol, 'cpan')
        with:
          perl-version: ${{ env.PERL_VERSION }}

      - uses: cachix/install-nix-action@v30
        if: contains(matrix.protocol, 'nix')

      - uses: leafo/gh-actions-lua@v10
        if: contains(matrix.protocol, 'luarocks')
        with:
          luaVersion: "5.4"
      - uses: leafo/gh-actions-luarocks@v4
        if: contains(matrix.protocol, 'luarocks')

      - name: install the Lua headers luarocks needs to build a rock
        if: contains(matrix.protocol, 'luarocks')
        run: |
          set -eu
          # luafilesystem is a C extension: luarocks runs a compiler and needs
          # lua.h. Without it:
          #   Error: Failed finding Lua header files. You may need to install
          #   them or configure LUA_INCDIR.
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq \
            liblua5.4-dev build-essential >/dev/null
          # Tell the suite where the headers landed.
          INC=$(dirname "$(find /usr/include -name lua.h | head -1)")
          echo "LUA_INCDIR=${INC:-/usr/include/lua5.4}" >> "$GITHUB_ENV"
          echo "lua headers: ${INC:-not found}"

      - uses: bazel-contrib/setup-bazel@0.8.5
        if: contains(matrix.protocol, 'bazel')
        with:
          bazelisk-cache: true

      - name: install buf
        if: contains(matrix.protocol, 'protobuf')
        run: |
          set -eu
          # NOT bufbuild/buf-setup-action: it resolves the release through the
          # GitHub API and dies on the shared-runner rate limit:
          #   API rate limit exceeded for 52.160.160.242
          # Downloading the release asset directly avoids the API entirely.
          V="${{ env.BUF_VERSION }}"
          curl -fsSL -o /tmp/buf \
            "https://github.com/bufbuild/buf/releases/download/v${V}/buf-Linux-x86_64"
          install -m 0755 /tmp/buf /usr/local/bin/buf
          buf --version
          # The e2e suite drives the REAL buf CLI when BUF_BIN is set, so the
          # publish path is exercised by the actual client and not only by a
          # hand-built Connect request.
          echo "BUF_BIN=/usr/local/bin/buf" >> "$GITHUB_ENV"
          # `buf push` takes a SOURCE DIRECTORY, not a URL; the registry comes
          # from the module name in buf.yaml (<host>/<owner>/<repo>). So the
          # mirror needs a HOSTNAME the CLI can resolve, pointing at this job's
          # own server.
          BSR_HOST="bsr.easyblobs.test"
          if ! grep -q "$BSR_HOST" /etc/hosts 2>/dev/null; then
            echo "127.0.0.1 $BSR_HOST" | sudo tee -a /etc/hosts >/dev/null
          fi
          getent hosts "$BSR_HOST" || true
          echo "BUF_REGISTRY_HOST=$BSR_HOST" >> "$GITHUB_ENV"
          # No TLS terminator and no certificate: buf supports plain HTTP when
          # its global config says 'tls: { use: false }' (connectclient picks
          # PrependHTTP when config.TLS is nil, and certclient returns nil for
          # that setting). The e2e suite writes that config file itself.
          echo "BUF_REGISTRY_PORT=${EASYBLOBS_PORT}" >> "$GITHUB_ENV"

      - uses: r-lib/actions/setup-r@v2
        if: contains(matrix.protocol, 'cran')
        with:
          r-version: ${{ env.R_VERSION }}

      - uses: swift-actions/setup-swift@v2
        if: contains(matrix.protocol, 'swift')
        with:
          swift-version: ${{ env.SWIFT_VERSION }}

      - uses: conda-incubator/setup-miniconda@v3
        if: contains(matrix.protocol, 'conda')
        with:
          miniforge-version: latest
          activate-environment: e2e

      - name: install php + composer runtime
        if: contains(matrix.protocol, 'composer')
        # ramsey/composer-install is deliberately NOT used: it insists on a
        # composer.json in the repository, while this suite creates its own
        # project in a temp directory. setup-php provides composer and php, and
        # the suite drives them itself - which is what is under test anyway.
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          tools: composer

      # gradle is a hosted protocol with its own fixture now, so the job needs
      # gradle itself. setup-java above already covers the JDK for the whole
      # maven family; this adds the build tool.
      - uses: gradle/actions/setup-gradle@v4
        if: contains(matrix.protocol, 'gradle')
        with:
          # The fixture ships no wrapper, so `gradle` must be on PATH.
          gradle-version: current

      - name: install sbt runner for ivy
        if: contains(matrix.protocol, 'ivy')
        uses: sbt/setup-sbt@v1
        with:
          sbt-runner-version: ${{ env.SBT_RUNNER_VERSION }}
          # install-dir has NO default in this action and it rejects an empty
          # value:
          #   install-dir must be non-empty and contain only [A-Za-z0-9._/$~-]
          install-dir: ${{ github.workspace }}/.sbt-runner

      - name: install jenkins-plugin-cli
        if: contains(matrix.protocol, 'jenkins')
        run: |
          set -eu
          V="${{ env.JENKINS_PLUGIN_MANAGER }}"
          curl -fsSL -o /opt/jpm.jar \
            "https://github.com/jenkinsci/plugin-installation-manager-tool/releases/download/${V}/jenkins-plugin-manager-${V}.jar"
          printf '%s\n' '#!/bin/sh' 'exec java -jar /opt/jpm.jar "$@"' > /usr/local/bin/jenkins-plugin-cli
          chmod +x /usr/local/bin/jenkins-plugin-cli
          jenkins-plugin-cli --version || true

      - name: install conan
        if: contains(matrix.protocol, 'conan')
        run: python3 -m pip install --quiet --disable-pip-version-check conan

      # ---- the server + the suite ----------------------------------------
      - name: start easyblobs
        run: |
          set -eu
          chmod +x /tmp/bin/easyblobs-bin
          mkdir -p /tmp/eb-data
          # EASYBLOBS_DEBUG makes the server log every request, which the cache
          # assertions rely on when a protocol looks like it stored nothing.
          EASYBLOBS_DEBUG=1 /tmp/bin/easyblobs-bin --listen "0.0.0.0:${EASYBLOBS_PORT}" \
            --data /tmp/eb-data --self-base "http://127.0.0.1:${EASYBLOBS_PORT}" \
            >/tmp/easyblobs.log 2>&1 &
          i=0
          until curl -fsS --noproxy '*' "http://127.0.0.1:${EASYBLOBS_PORT}/healthz" >/dev/null 2>&1; do
            i=$((i+1)); [ "$i" -gt 120 ] && { cat /tmp/easyblobs.log; exit 1; }
            sleep 0.5
          done
          curl -fsS --noproxy '*' "http://127.0.0.1:${EASYBLOBS_PORT}/healthz"
          {
            echo "EASYBLOBS_ORIGIN=http://127.0.0.1:${EASYBLOBS_PORT}"
            echo "EASYBLOBS_DATA=/tmp/eb-data"
          } >> "$GITHUB_ENV"

      # NO fixture clone here: this job only fetches from upstream, and the
      # fixtures are publish-side projects. The `hosted` job clones them.
      - name: fetch an upstream package with the real client
        run: |
          set -u
          echo "ORIGIN=${EASYBLOBS_ORIGIN:-unset}"
          echo "protocol=${{ matrix.protocol }} direction=pull"
          sh -x e2e/ci-run.sh "${{ matrix.protocol }}"

      - name: upload the server log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: easyblobs-log-${{ matrix.protocol }}
          path: /tmp/easyblobs.log
          if-no-files-found: ignore
  # ---------------------------------------------------------------------------
  # HOSTED: a real client PUBLISHES its own artefact and reads it back.
  #
  # The other half of the mirror's job, and independent of the network: the
  # project comes from easydev-org/easyblobs-test, is built with the same
  # toolchain, published through the mount and read back byte for byte.
  #
  # Separate from `clients` (pull) so the two results never mask each other:
  # if this job fails, publishing is broken; if only `clients` fails, fetching
  # from upstream is. One shared job cannot say which.
  #
  # Only protocols whose fixture exists are listed - that set is the third
  # column of e2e/ci-matrix.tsv, so adding a fixture is a one-line change there.
  # ---------------------------------------------------------------------------
  # ---------------------------------------------------------------------------
  # BUILD-ONLY: a read-only mirror has no write path, so the fixture is built
  # and nothing is published.
  #
  # Six protocols are Kind:Mirror in targets/builtin.go - cran, cpan, juliapkg,
  # jsr, plus bazel and swift which answer metadata only. There is no endpoint
  # to publish to, so demanding a publish would be inventing a requirement the
  # product does not have. What IS checkable: the toolchain builds a real
  # project from easyblobs-test, its own tests pass, and the artefact is
  # packaged - which their publish.sh does before the publish call it never
  # reaches under E2E_BUILD_ONLY=1.
  #
  # Without this job those six fixtures sat in the repository unexecuted: real
  # projects that looked like coverage and were not.
  # ---------------------------------------------------------------------------
  build-only:
    needs: [server, matrix]
    runs-on: ubuntu-latest
    env:
      E2E_DIRECTION: build
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.matrix.outputs.buildonly) }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: easyblobs-bin
          path: /tmp/bin

      # ---- toolchains, each guarded by the protocol that needs it ----------
      - uses: actions/setup-go@v5
        if: contains(matrix.protocol, 'go')
        with:
          go-version-file: go.work
          cache: true

      - uses: actions/setup-node@v4
        if: contains(matrix.protocol, 'npm')
        with:
          node-version: ${{ env.NODE_VERSION }}

      - uses: actions/setup-python@v5
        if: contains(matrix.protocol, 'pypi') || contains(matrix.protocol, 'huggingface') || contains(matrix.protocol, 'conan')
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - uses: actions/setup-java@v4
        if: contains(matrix.protocol, 'maven') || contains(matrix.protocol, 'gradle') || contains(matrix.protocol, 'ivy') || contains(matrix.protocol, 'jenkins') || contains(matrix.protocol, 'google') || contains(matrix.protocol, 'clojars') || contains(matrix.protocol, 'spring') || contains(matrix.protocol, 'jitpack')
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - uses: actions/setup-dotnet@v4
        if: contains(matrix.protocol, 'nuget')
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - uses: ruby/setup-ruby@v1
        if: contains(matrix.protocol, 'rubygems')
        with:
          ruby-version: ${{ env.RUBY_VERSION }}

      - uses: dtolnay/rust-toolchain@stable
        if: contains(matrix.protocol, 'cargo')

      - uses: denoland/setup-deno@v2
        if: contains(matrix.protocol, 'jsr')
        with:
          deno-version: ${{ env.DENO_VERSION }}

      - uses: azure/setup-helm@v4
        if: contains(matrix.protocol, 'helm')
        with:
          version: ${{ env.HELM_VERSION }}

      - uses: erlef/setup-beam@v1
        if: contains(matrix.protocol, 'hex')
        with:
          otp-version: "27"
          elixir-version: "1.17"

      - uses: dart-lang/setup-dart@v1
        if: contains(matrix.protocol, 'pub')

      - uses: julia-actions/setup-julia@v2
        if: contains(matrix.protocol, 'juliapkg')
        with:
          version: ${{ env.JULIA_VERSION }}

      - uses: haskell-actions/setup@v2
        if: contains(matrix.protocol, 'hackage') || contains(matrix.protocol, 'stackage')
        with:
          ghc-version: ${{ env.HASKELL_GHC }}
          cabal-version: latest

      - uses: ocaml/setup-ocaml@v3
        if: contains(matrix.protocol, 'opam')
        with:
          ocaml-compiler: ${{ env.OCAML_VERSION }}

      - uses: shivammathur/setup-php@v2
        if: contains(matrix.protocol, 'pecl')
        with:
          php-version: ${{ env.PHP_VERSION }}
          tools: pecl, phpize

      - uses: shogo82148/actions-setup-perl@v1
        if: contains(matrix.protocol, 'cpan')
        with:
          perl-version: ${{ env.PERL_VERSION }}

      - uses: cachix/install-nix-action@v30
        if: contains(matrix.protocol, 'nix')

      - uses: leafo/gh-actions-lua@v10
        if: contains(matrix.protocol, 'luarocks')
        with:
          luaVersion: "5.4"
      - uses: leafo/gh-actions-luarocks@v4
        if: contains(matrix.protocol, 'luarocks')

      - name: install the Lua headers luarocks needs to build a rock
        if: contains(matrix.protocol, 'luarocks')
        run: |
          set -eu
          # luafilesystem is a C extension: luarocks runs a compiler and needs
          # lua.h. Without it:
          #   Error: Failed finding Lua header files. You may need to install
          #   them or configure LUA_INCDIR.
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq \
            liblua5.4-dev build-essential >/dev/null
          # Tell the suite where the headers landed.
          INC=$(dirname "$(find /usr/include -name lua.h | head -1)")
          echo "LUA_INCDIR=${INC:-/usr/include/lua5.4}" >> "$GITHUB_ENV"
          echo "lua headers: ${INC:-not found}"

      - uses: bazel-contrib/setup-bazel@0.8.5
        if: contains(matrix.protocol, 'bazel')
        with:
          bazelisk-cache: true

      - name: install buf
        if: contains(matrix.protocol, 'protobuf')
        run: |
          set -eu
          # NOT bufbuild/buf-setup-action: it resolves the release through the
          # GitHub API and dies on the shared-runner rate limit:
          #   API rate limit exceeded for 52.160.160.242
          # Downloading the release asset directly avoids the API entirely.
          V="${{ env.BUF_VERSION }}"
          curl -fsSL -o /tmp/buf \
            "https://github.com/bufbuild/buf/releases/download/v${V}/buf-Linux-x86_64"
          install -m 0755 /tmp/buf /usr/local/bin/buf
          buf --version
          # The e2e suite drives the REAL buf CLI when BUF_BIN is set, so the
          # publish path is exercised by the actual client and not only by a
          # hand-built Connect request.
          echo "BUF_BIN=/usr/local/bin/buf" >> "$GITHUB_ENV"
          # `buf push` takes a SOURCE DIRECTORY, not a URL; the registry comes
          # from the module name in buf.yaml (<host>/<owner>/<repo>). So the
          # mirror needs a HOSTNAME the CLI can resolve, pointing at this job's
          # own server.
          BSR_HOST="bsr.easyblobs.test"
          if ! grep -q "$BSR_HOST" /etc/hosts 2>/dev/null; then
            echo "127.0.0.1 $BSR_HOST" | sudo tee -a /etc/hosts >/dev/null
          fi
          getent hosts "$BSR_HOST" || true
          echo "BUF_REGISTRY_HOST=$BSR_HOST" >> "$GITHUB_ENV"
          # No TLS terminator and no certificate: buf supports plain HTTP when
          # its global config says 'tls: { use: false }' (connectclient picks
          # PrependHTTP when config.TLS is nil, and certclient returns nil for
          # that setting). The e2e suite writes that config file itself.
          echo "BUF_REGISTRY_PORT=${EASYBLOBS_PORT}" >> "$GITHUB_ENV"

      - uses: r-lib/actions/setup-r@v2
        if: contains(matrix.protocol, 'cran')
        with:
          r-version: ${{ env.R_VERSION }}

      - uses: swift-actions/setup-swift@v2
        if: contains(matrix.protocol, 'swift')
        with:
          swift-version: ${{ env.SWIFT_VERSION }}

      - uses: conda-incubator/setup-miniconda@v3
        if: contains(matrix.protocol, 'conda')
        with:
          miniforge-version: latest
          activate-environment: e2e

      - name: install php + composer runtime
        if: contains(matrix.protocol, 'composer')
        # ramsey/composer-install is deliberately NOT used: it insists on a
        # composer.json in the repository, while this suite creates its own
        # project in a temp directory. setup-php provides composer and php, and
        # the suite drives them itself - which is what is under test anyway.
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          tools: composer

      # gradle is a hosted protocol with its own fixture now, so the job needs
      # gradle itself. setup-java above already covers the JDK for the whole
      # maven family; this adds the build tool.
      - uses: gradle/actions/setup-gradle@v4
        if: contains(matrix.protocol, 'gradle')
        with:
          # The fixture ships no wrapper, so `gradle` must be on PATH.
          gradle-version: current

      - name: install sbt runner for ivy
        if: contains(matrix.protocol, 'ivy')
        uses: sbt/setup-sbt@v1
        with:
          sbt-runner-version: ${{ env.SBT_RUNNER_VERSION }}
          # install-dir has NO default in this action and it rejects an empty
          # value:
          #   install-dir must be non-empty and contain only [A-Za-z0-9._/$~-]
          install-dir: ${{ github.workspace }}/.sbt-runner

      - name: install jenkins-plugin-cli
        if: contains(matrix.protocol, 'jenkins')
        run: |
          set -eu
          V="${{ env.JENKINS_PLUGIN_MANAGER }}"
          curl -fsSL -o /opt/jpm.jar \
            "https://github.com/jenkinsci/plugin-installation-manager-tool/releases/download/${V}/jenkins-plugin-manager-${V}.jar"
          printf '%s\n' '#!/bin/sh' 'exec java -jar /opt/jpm.jar "$@"' > /usr/local/bin/jenkins-plugin-cli
          chmod +x /usr/local/bin/jenkins-plugin-cli
          jenkins-plugin-cli --version || true

      - name: install conan
        if: contains(matrix.protocol, 'conan')
        run: python3 -m pip install --quiet --disable-pip-version-check conan

      # ---- the server + the suite ----------------------------------------

      - name: start easyblobs
        run: |
          set -eu
          chmod +x /tmp/bin/easyblobs-bin
          mkdir -p /tmp/eb-data
          EASYBLOBS_DEBUG=1 /tmp/bin/easyblobs-bin --listen "0.0.0.0:${EASYBLOBS_PORT}" \
            --data /tmp/eb-data --self-base "http://127.0.0.1:${EASYBLOBS_PORT}" \
            >/tmp/easyblobs.log 2>&1 &
          i=0
          until curl -fsS --noproxy '*' "http://127.0.0.1:${EASYBLOBS_PORT}/healthz" >/dev/null 2>&1; do
            i=$((i+1)); [ "$i" -gt 120 ] && { cat /tmp/easyblobs.log; exit 1; }
            sleep 0.5
          done
          {
            echo "EASYBLOBS_ORIGIN=http://127.0.0.1:${EASYBLOBS_PORT}"
            echo "EASYBLOBS_DATA=/tmp/eb-data"
          } >> "$GITHUB_ENV"

      - name: clone the fixture repository
        run: |
          set -eu
          git clone --depth 1 --quiet \
            "https://github.com/${E2E_FIXTURE_REPO}.git" /tmp/fixtures
          echo "E2E_FIXTURES=/tmp/fixtures" >> "$GITHUB_ENV"

      - name: build the fixture (nothing is published)
        run: |
          set -u
          sh -x e2e/ci-run.sh "${{ matrix.protocol }}"

      - name: upload the server log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: easyblobs-log-buildonly-${{ matrix.protocol }}
          path: /tmp/easyblobs.log
          if-no-files-found: ignore

  hosted:
    needs: [server, matrix]
    runs-on: ubuntu-latest
    env:
      E2E_DIRECTION: hosted
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.matrix.outputs.hosted) }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: easyblobs-bin
          path: /tmp/bin

      # ---- toolchains, each guarded by the protocol that needs it ----------
      - uses: actions/setup-go@v5
        if: contains(matrix.protocol, 'go')
        with:
          go-version-file: go.work
          cache: true

      - uses: actions/setup-node@v4
        if: contains(matrix.protocol, 'npm')
        with:
          node-version: ${{ env.NODE_VERSION }}

      - uses: actions/setup-python@v5
        if: contains(matrix.protocol, 'pypi') || contains(matrix.protocol, 'huggingface') || contains(matrix.protocol, 'conan')
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - uses: actions/setup-java@v4
        if: contains(matrix.protocol, 'maven') || contains(matrix.protocol, 'gradle') || contains(matrix.protocol, 'ivy') || contains(matrix.protocol, 'jenkins') || contains(matrix.protocol, 'google') || contains(matrix.protocol, 'clojars') || contains(matrix.protocol, 'spring') || contains(matrix.protocol, 'jitpack')
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      - uses: actions/setup-dotnet@v4
        if: contains(matrix.protocol, 'nuget')
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - uses: ruby/setup-ruby@v1
        if: contains(matrix.protocol, 'rubygems')
        with:
          ruby-version: ${{ env.RUBY_VERSION }}

      - uses: dtolnay/rust-toolchain@stable
        if: contains(matrix.protocol, 'cargo')

      - uses: denoland/setup-deno@v2
        if: contains(matrix.protocol, 'jsr')
        with:
          deno-version: ${{ env.DENO_VERSION }}

      - uses: azure/setup-helm@v4
        if: contains(matrix.protocol, 'helm')
        with:
          version: ${{ env.HELM_VERSION }}

      - uses: erlef/setup-beam@v1
        if: contains(matrix.protocol, 'hex')
        with:
          otp-version: "27"
          elixir-version: "1.17"

      - uses: dart-lang/setup-dart@v1
        if: contains(matrix.protocol, 'pub')

      - uses: julia-actions/setup-julia@v2
        if: contains(matrix.protocol, 'juliapkg')
        with:
          version: ${{ env.JULIA_VERSION }}

      - uses: haskell-actions/setup@v2
        if: contains(matrix.protocol, 'hackage') || contains(matrix.protocol, 'stackage')
        with:
          ghc-version: ${{ env.HASKELL_GHC }}
          cabal-version: latest

      - uses: ocaml/setup-ocaml@v3
        if: contains(matrix.protocol, 'opam')
        with:
          ocaml-compiler: ${{ env.OCAML_VERSION }}

      - uses: shivammathur/setup-php@v2
        if: contains(matrix.protocol, 'pecl')
        with:
          php-version: ${{ env.PHP_VERSION }}
          tools: pecl, phpize

      - uses: shogo82148/actions-setup-perl@v1
        if: contains(matrix.protocol, 'cpan')
        with:
          perl-version: ${{ env.PERL_VERSION }}

      - uses: cachix/install-nix-action@v30
        if: contains(matrix.protocol, 'nix')

      - uses: leafo/gh-actions-lua@v10
        if: contains(matrix.protocol, 'luarocks')
        with:
          luaVersion: "5.4"
      - uses: leafo/gh-actions-luarocks@v4
        if: contains(matrix.protocol, 'luarocks')

      - name: install the Lua headers luarocks needs to build a rock
        if: contains(matrix.protocol, 'luarocks')
        run: |
          set -eu
          # luafilesystem is a C extension: luarocks runs a compiler and needs
          # lua.h. Without it:
          #   Error: Failed finding Lua header files. You may need to install
          #   them or configure LUA_INCDIR.
          sudo apt-get update -qq
          sudo DEBIAN_FRONTEND=noninteractive apt-get install -y -qq \
            liblua5.4-dev build-essential >/dev/null
          # Tell the suite where the headers landed.
          INC=$(dirname "$(find /usr/include -name lua.h | head -1)")
          echo "LUA_INCDIR=${INC:-/usr/include/lua5.4}" >> "$GITHUB_ENV"
          echo "lua headers: ${INC:-not found}"

      - uses: bazel-contrib/setup-bazel@0.8.5
        if: contains(matrix.protocol, 'bazel')
        with:
          bazelisk-cache: true

      - name: install buf
        if: contains(matrix.protocol, 'protobuf')
        run: |
          set -eu
          # NOT bufbuild/buf-setup-action: it resolves the release through the
          # GitHub API and dies on the shared-runner rate limit:
          #   API rate limit exceeded for 52.160.160.242
          # Downloading the release asset directly avoids the API entirely.
          V="${{ env.BUF_VERSION }}"
          curl -fsSL -o /tmp/buf \
            "https://github.com/bufbuild/buf/releases/download/v${V}/buf-Linux-x86_64"
          install -m 0755 /tmp/buf /usr/local/bin/buf
          buf --version
          # The e2e suite drives the REAL buf CLI when BUF_BIN is set, so the
          # publish path is exercised by the actual client and not only by a
          # hand-built Connect request.
          echo "BUF_BIN=/usr/local/bin/buf" >> "$GITHUB_ENV"
          # `buf push` takes a SOURCE DIRECTORY, not a URL; the registry comes
          # from the module name in buf.yaml (<host>/<owner>/<repo>). So the
          # mirror needs a HOSTNAME the CLI can resolve, pointing at this job's
          # own server.
          BSR_HOST="bsr.easyblobs.test"
          if ! grep -q "$BSR_HOST" /etc/hosts 2>/dev/null; then
            echo "127.0.0.1 $BSR_HOST" | sudo tee -a /etc/hosts >/dev/null
          fi
          getent hosts "$BSR_HOST" || true
          echo "BUF_REGISTRY_HOST=$BSR_HOST" >> "$GITHUB_ENV"
          # No TLS terminator and no certificate: buf supports plain HTTP when
          # its global config says 'tls: { use: false }' (connectclient picks
          # PrependHTTP when config.TLS is nil, and certclient returns nil for
          # that setting). The e2e suite writes that config file itself.
          echo "BUF_REGISTRY_PORT=${EASYBLOBS_PORT}" >> "$GITHUB_ENV"

      - uses: r-lib/actions/setup-r@v2
        if: contains(matrix.protocol, 'cran')
        with:
          r-version: ${{ env.R_VERSION }}

      - uses: swift-actions/setup-swift@v2
        if: contains(matrix.protocol, 'swift')
        with:
          swift-version: ${{ env.SWIFT_VERSION }}

      - uses: conda-incubator/setup-miniconda@v3
        if: contains(matrix.protocol, 'conda')
        with:
          miniforge-version: latest
          activate-environment: e2e

      - name: install php + composer runtime
        if: contains(matrix.protocol, 'composer')
        # ramsey/composer-install is deliberately NOT used: it insists on a
        # composer.json in the repository, while this suite creates its own
        # project in a temp directory. setup-php provides composer and php, and
        # the suite drives them itself - which is what is under test anyway.
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ env.PHP_VERSION }}
          tools: composer

      # Same reason as in `clients`: the gradle fixture needs gradle itself.
      - uses: gradle/actions/setup-gradle@v4
        if: contains(matrix.protocol, 'gradle')
        with:
          gradle-version: current

      - name: install sbt runner for ivy
        if: contains(matrix.protocol, 'ivy')
        uses: sbt/setup-sbt@v1
        with:
          sbt-runner-version: ${{ env.SBT_RUNNER_VERSION }}
          # install-dir has NO default in this action and it rejects an empty
          # value:
          #   install-dir must be non-empty and contain only [A-Za-z0-9._/$~-]
          install-dir: ${{ github.workspace }}/.sbt-runner

      - name: install jenkins-plugin-cli
        if: contains(matrix.protocol, 'jenkins')
        run: |
          set -eu
          V="${{ env.JENKINS_PLUGIN_MANAGER }}"
          curl -fsSL -o /opt/jpm.jar \
            "https://github.com/jenkinsci/plugin-installation-manager-tool/releases/download/${V}/jenkins-plugin-manager-${V}.jar"
          printf '%s\n' '#!/bin/sh' 'exec java -jar /opt/jpm.jar "$@"' > /usr/local/bin/jenkins-plugin-cli
          chmod +x /usr/local/bin/jenkins-plugin-cli
          jenkins-plugin-cli --version || true

      - name: install conan
        if: contains(matrix.protocol, 'conan')
        run: python3 -m pip install --quiet --disable-pip-version-check conan

      # ---- the server + the suite ----------------------------------------
      - name: start easyblobs
        run: |
          set -eu
          chmod +x /tmp/bin/easyblobs-bin
          mkdir -p /tmp/eb-data
          # EASYBLOBS_DEBUG makes the server log every request, which the cache
          # assertions rely on when a protocol looks like it stored nothing.
          EASYBLOBS_DEBUG=1 /tmp/bin/easyblobs-bin --listen "0.0.0.0:${EASYBLOBS_PORT}" \
            --data /tmp/eb-data --self-base "http://127.0.0.1:${EASYBLOBS_PORT}" \
            >/tmp/easyblobs.log 2>&1 &
          i=0
          until curl -fsS --noproxy '*' "http://127.0.0.1:${EASYBLOBS_PORT}/healthz" >/dev/null 2>&1; do
            i=$((i+1)); [ "$i" -gt 120 ] && { cat /tmp/easyblobs.log; exit 1; }
            sleep 0.5
          done
          curl -fsS --noproxy '*' "http://127.0.0.1:${EASYBLOBS_PORT}/healthz"
          {
            echo "EASYBLOBS_ORIGIN=http://127.0.0.1:${EASYBLOBS_PORT}"
            echo "EASYBLOBS_DATA=/tmp/eb-data"
          } >> "$GITHUB_ENV"

      - name: start easyblobs
        run: |
          set -eu
          chmod +x /tmp/bin/easyblobs-bin
          mkdir -p /tmp/eb-data
          EASYBLOBS_DEBUG=1 /tmp/bin/easyblobs-bin --listen "0.0.0.0:${EASYBLOBS_PORT}" \
            --data /tmp/eb-data --self-base "http://127.0.0.1:${EASYBLOBS_PORT}" \
            >/tmp/easyblobs.log 2>&1 &
          i=0
          until curl -fsS --noproxy '*' "http://127.0.0.1:${EASYBLOBS_PORT}/healthz" >/dev/null 2>&1; do
            i=$((i+1)); [ "$i" -gt 120 ] && { cat /tmp/easyblobs.log; exit 1; }
            sleep 0.5
          done
          {
            echo "EASYBLOBS_ORIGIN=http://127.0.0.1:${EASYBLOBS_PORT}"
            echo "EASYBLOBS_DATA=/tmp/eb-data"
          } >> "$GITHUB_ENV"

      - name: clone the fixture repository
        run: |
          set -eu
          # Required here, unlike the pull job: without it there is nothing to
          # publish, and a silent fallback would turn this job into a no-op.
          git clone --depth 1 --quiet \
            "https://github.com/${E2E_FIXTURE_REPO}.git" /tmp/fixtures
          echo "E2E_FIXTURES=/tmp/fixtures" >> "$GITHUB_ENV"

      - name: publish the fixture and read it back
        run: |
          set -u
          sh -x e2e/ci-run.sh "${{ matrix.protocol }}"

      - name: upload the server log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: easyblobs-log-hosted-${{ matrix.protocol }}
          path: /tmp/easyblobs.log
          if-no-files-found: ignore
  verify-easysetup:
    needs: [server]
    runs-on: ubuntu-latest
    env:
      # HOSTED: these fixtures build and publish their own artefact. The pull
      # direction for the same protocols is covered by `clients`.
      E2E_DIRECTION: hosted
    strategy:
      fail-fast: false
      matrix:
        include:
          # tools: one setup name per toolchain the fixture needs. easysetup
          # publishes one version per tool, so a bare name is exact - there is no
          # version to pin here and nothing to drift.
          #
          # The PROTOCOL is the mount path and the name in e2e/ci-matrix.tsv; the
          # fixture DIRECTORY is different for several of them, and
          # fixture_dir_for_protocol() maps npm->node, pypi->python, etc.
          - { protocol: npm,      tools: "node" }
          # pip is its own setup (pythonPackages.pip). The 'python' setup alone
          # is a bare interpreter with no pip, so a fixture that runs
          # `python -m build` and `twine` needs both names.
          - { protocol: pypi,     tools: "python pip" }
          - { protocol: go,       tools: "go" }
          - { protocol: maven,    tools: "java maven" }
          - { protocol: rubygems, tools: "ruby" }
          # easysetup publishes micromamba for the conda protocol: one static
          # conda-compatible binary, no base install. That is the client to drive.
          - { protocol: conda,    tools: "micromamba" }
          - { protocol: nuget,    tools: "dotnet" }
          - { protocol: composer, tools: "php" }
          - { protocol: hex,      tools: "elixir erlang" }
          - { protocol: helm,     tools: "helm" }
          # cargo is its own setup (pkgs.cargo). 'rust' is pkgs.rustc, the
          # compiler only, so a crate cannot be built or published with it.
          - { protocol: cargo,    tools: "rust cargo" }
    steps:
      - uses: actions/checkout@v4

      - uses: easydev-org/easysetup@main
        with:
          tools: ${{ matrix.tools }}
          # NO cli-version pin. I tried one and it broke every verify-easysetup
          # job with:
          #   easysetup v2026.10.24-92cc0e8 for linux/amd64
          #   ##[error]published checksum is empty
          #
          # The release DOES publish the file - a direct fetch of
          # .../v2026.10.24-92cc0e8/easysetup-linux-amd64.sha256 returns 65
          # bytes - so this is a bug in the action's pinned path, not in the
          # release. The unpinned path works: it resolves the tag through
          # /releases/latest and downloads successfully, which is what those 11
          # jobs had been doing.
          #
          # Reported upstream rather than worked around: the alternative is
          # vendoring the checksum file or re-implementing the download here,
          # and both would hide the defect while adding machinery we would have
          # to keep in sync.

      # Nothing here installs a language. Everything a BUILD needs beyond the
      # toolchain - git, zip, a C toolchain for native extensions, jq for the
      # fixtures - is installed here, and never a language runtime: that is the
      # toolchain's job and easysetup's whole point.
      #
      # `sudo`, because this job now runs on the runner image rather than inside
      # a container as root.
      - name: install what building a project needs (never a toolchain)
        run: |
          set -eu
          sudo env DEBIAN_FRONTEND=noninteractive apt-get update -qq
          sudo env DEBIAN_FRONTEND=noninteractive apt-get install -y -qq \
            --no-install-recommends \
            ca-certificates curl git zip unzip build-essential python3 jq zstd

      - name: show the toolchain easysetup provided
        run: |
          set -eu
          echo "requested: ${{ matrix.tools }}"
          # The registry files are the source of truth for what was unpacked.
          for f in /nix/setup-root-*; do
            [ -f "$f" ] || continue
            echo "  $(basename "$f"): $(cat "$f")"
          done
          for c in node python3 go java mvn ruby conda dotnet php mix elixir helm cargo composer; do
            if command -v "$c" >/dev/null 2>&1; then
              printf '%-10s %s\n' "$c" "$(command -v "$c")"
            fi
          done

      - uses: actions/download-artifact@v4
        with:
          name: easyblobs-bin
          path: /tmp/bin

      - name: start easyblobs
        run: |
          set -eu
          chmod +x /tmp/bin/easyblobs-bin
          mkdir -p /tmp/eb-data
          EASYBLOBS_DEBUG=1 /tmp/bin/easyblobs-bin --listen "0.0.0.0:${EASYBLOBS_PORT}" \
            --data /tmp/eb-data --self-base "http://127.0.0.1:${EASYBLOBS_PORT}" \
            >/tmp/easyblobs.log 2>&1 &
          i=0
          until curl -fsS --noproxy '*' "http://127.0.0.1:${EASYBLOBS_PORT}/healthz" >/dev/null 2>&1; do
            i=$((i+1)); [ "$i" -gt 120 ] && { cat /tmp/easyblobs.log; exit 1; }
            sleep 0.5
          done
          {
            echo "EASYBLOBS_ORIGIN=http://127.0.0.1:${EASYBLOBS_PORT}"
            echo "EASYBLOBS_DATA=/tmp/eb-data"
          } >> "$GITHUB_ENV"

      - name: clone the fixture repository
        run: |
          set -eu
          if git clone --depth 1 --quiet \
               "https://github.com/${E2E_FIXTURE_REPO}.git" /tmp/fixtures; then
            echo "E2E_FIXTURES=/tmp/fixtures" >> "$GITHUB_ENV"
          else
            echo "::error::could not clone ${E2E_FIXTURE_REPO}; diagnostics:" >&2
            { command -v git && git --version; } 2>&1 | sed 's/^/  git: /' >&2 || true
            ls -l /etc/ssl/certs/ca-certificates.crt 2>&1 | sed 's/^/  ca: /' >&2 || true
            getent hosts github.com 2>&1 | sed 's/^/  dns: /' >&2 || true
            exit 1
          fi

      # The payload: the easysetup toolchain builds the real project, publishes
      # through the mount and reads it back.
      #
      # No sourcing of env.sh: the action already put the tool directories on
      # $GITHUB_PATH, and `shell: bash` is only here because env.sh is bash and
      # the harness may source it for tools that need more than PATH.
      - name: build and publish with the easysetup toolchain
        shell: bash
        run: |
          set -eu
          sh -x e2e/ci-run.sh "${{ matrix.protocol }}"

      - name: upload the server log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: easyblobs-log-easysetup-${{ matrix.protocol }}
          path: /tmp/easyblobs.log
          if-no-files-found: ignore

  distro-clients:
    needs: [server, matrix]
    runs-on: ubuntu-latest
    env:
      # PULL: apk/apt/dnf install from the mount is a pull-through by nature -
      # the mount fetches from the distro's repository and caches it. These have
      # no hosted fixture (you cannot publish an .deb through them this way).
      E2E_DIRECTION: pull
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.matrix.outputs.distro) }}
    container:
      image: ${{ matrix.image }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: easyblobs-bin
          path: /tmp/bin

      - name: install the basics this image lacks
        run: |
          set -eu
          need=""
          for t in curl wget tar; do
            command -v "$t" >/dev/null || need="$need $t"
          done
          if [ -n "$need" ]; then
            if command -v apk >/dev/null; then
              apk add --no-cache $need
            elif command -v apt-get >/dev/null; then
              apt-get update -qq && apt-get install -y -qq $need >/dev/null
            elif command -v dnf >/dev/null; then
              dnf install -y -q $need >/dev/null
            fi
          fi

      - name: start easyblobs
        run: |
          set -eu
          chmod +x /tmp/bin/easyblobs-bin
          mkdir -p /tmp/eb-data
          EASYBLOBS_DEBUG=1 /tmp/bin/easyblobs-bin --listen "0.0.0.0:${EASYBLOBS_PORT}" \
            --data /tmp/eb-data --self-base "http://127.0.0.1:${EASYBLOBS_PORT}" \
            >/tmp/easyblobs.log 2>&1 &
          i=0
          until curl -fsS --noproxy '*' "http://127.0.0.1:${EASYBLOBS_PORT}/healthz" >/dev/null 2>&1; do
            i=$((i+1)); [ "$i" -gt 120 ] && { cat /tmp/easyblobs.log; exit 1; }
            sleep 0.5
          done
          curl -fsS --noproxy '*' "http://127.0.0.1:${EASYBLOBS_PORT}/healthz"
          {
            echo "EASYBLOBS_ORIGIN=http://127.0.0.1:${EASYBLOBS_PORT}"
            echo "EASYBLOBS_DATA=/tmp/eb-data"
          } >> "$GITHUB_ENV"

      - name: clone the fixture repository
        run: |
          set -eu
          # Inside the distro image: the fixtures are plain source trees, so they
          # work the same way here.
          if command -v git >/dev/null && \
             git clone --depth 1 --quiet \
               "https://github.com/${E2E_FIXTURE_REPO}.git" /tmp/fixtures; then
            echo "E2E_FIXTURES=/tmp/fixtures" >> "$GITHUB_ENV"
          else
            echo "NOTE: no fixture repository; falling back to the hand-written suites"
          fi

      - name: run the real client
        run: |
          set -u
          echo "protocol=${{ matrix.protocol }} image=${{ matrix.image }}"
          sh -x e2e/ci-run.sh "${{ matrix.protocol }}"

      - name: upload the server log on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: easyblobs-log-${{ matrix.protocol }}
          path: /tmp/easyblobs.log
          if-no-files-found: ignore
